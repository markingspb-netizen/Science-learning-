<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UAE Science Quests</title>
<style>
:root{--bg:#fbf6ec;--card:#fff;--ink:#1d2433;--mute:#5d6678;--line:#e6dcc8;--gold:#c8891a;--accent:#0f766e;--bad:#b3362b;--good:#1b7f4b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--card:#1a2130;--ink:#eef1f7;--mute:#9aa4b8;--line:#2b3448;--gold:#f0b44a;--accent:#2dd4bf;--bad:#ff7b6e;--good:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151f;--card:#1a2130;--ink:#eef1f7;--mute:#9aa4b8;--line:#2b3448;--gold:#f0b44a;--accent:#2dd4bf;--bad:#ff7b6e;--good:#4ade80;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:1.9rem;margin:6px 0 2px;line-height:1.15}
.sub{color:var(--mute);margin:0 0 14px}
.hud{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.pts{font-size:1.6rem;font-weight:800;color:var(--gold)}
.rank{font-weight:700}
.bar{flex:1 1 100%;height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .5s}
.badges{display:flex;gap:8px;flex-wrap:wrap;flex:1 1 100%}
.b{font-size:.8rem;padding:4px 10px;border-radius:99px;border:1px dashed var(--line);color:var(--mute)}
.b.on{border:1px solid var(--gold);color:var(--gold);font-weight:700;background:color-mix(in srgb,var(--gold) 12%,transparent)}
.tabs{display:flex;gap:8px;margin:18px 0 12px;overflow-x:auto}
.tab{flex:1;min-width:110px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.intro{color:var(--mute);margin:0 0 12px}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.q.done{border-color:var(--good)}
.q h2{margin:0 0 4px;font-size:1.15rem}
.tag{font-size:.75rem;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.q p{margin:6px 0 10px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.no{border-color:var(--bad);color:var(--bad);text-decoration:line-through;animation:sh .3s}
.opt.yes{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent);font-weight:700}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.win{margin-top:10px;padding:12px;border-radius:12px;background:color-mix(in srgb,var(--gold) 12%,transparent);border:1px solid var(--gold)}
.win b.g{color:var(--gold)}
.book{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.cert{display:none;text-align:center;margin-top:18px;padding:22px;border:2px solid var(--gold);border-radius:18px;background:var(--card)}
.cert.on{display:block}
.cert input{font:inherit;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:80%;max-width:280px}
.reset{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;margin-top:26px;font:inherit}
.pop{position:fixed;left:50%;top:22%;transform:translateX(-50%);font-size:2.4rem;font-weight:800;color:var(--gold);pointer-events:none;animation:up 1.1s forwards;z-index:9}
@keyframes up{to{transform:translate(-50%,-70px);opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔭 UAE Science Quests</h1>
  <p class="sub">Travel from pearl-diving navigators to Mars. Answer quests, earn points, unlock books!</p>
  <div class="hud">
    <div><span class="pts" id="pts">0</span> pts</div>
    <div class="rank" id="rank"></div>
    <div class="bar"><i id="fill"></i></div>
    <div class="badges" id="badges"></div>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <p class="intro" id="intro"></p>
  <div id="list"></div>
  <div class="cert" id="cert">
    <div style="font-size:2.4rem">🏆</div>
    <h2>Grand Prize: Science Explorer Certificate</h2>
    <p>You finished every quest! Type your name:</p>
    <input id="name" placeholder="Your name" maxlength="30">
    <p id="certline" style="font-weight:700;color:var(--gold)"></p>
  </div>
  <button class="reset" id="reset">Reset progress</button>
</div>
<script>
const ERAS=[
{id:"past",icon:"🏺",name:"Old Times",intro:"Long before satellites, people here read the stars, moved water through the desert and sailed the ocean."},
{id:"now",icon:"🚀",name:"Now",intro:"Today the UAE sends probes to Mars, astronauts to space and runs clean-energy power plants."},
{id:"future",icon:"🌌",name:"Future",intro:"The next goals are bold: a city on Mars, a moon airlock and a trip to the asteroid belt."}];
const Q=[
{e:"past",t:"The Navigator of Julfar",s:"Ahmad ibn Majid, called the 'Lion of the Sea', was born around 1432 in a port that is now in the UAE and wrote famous sea-navigation books.",q:"Which emirate is Julfar, his home port, part of today?",o:["Ras Al Khaimah","Fujairah","Umm Al Quwain"],a:0,f:"Julfar is in Ras Al Khaimah. Ibn Majid used stars and a compass to guide ships across the Indian Ocean.",bk:["Kitab al-Fawa’id","Ahmad ibn Majid","His own navigation handbook, a real sailor’s science book from the 1400s."]},
{e:"past",t:"Water in the Desert",s:"Farmers in oases like Al Ain used a falaj, an ancient system that carries water by gravity with no pumps.",q:"What does a falaj do?",o:["Sends signals with mirrors","Carries water in channels to farms and homes","Grinds dates into flour"],a:1,f:"The falaj carries water from underground sources or mountains to oasis farms. The falaj systems of Al Ain are part of a UNESCO World Heritage site.",bk:["Arabian Sands","Wilfred Thesiger","A classic account of desert life and the knowledge of the Bedu."]},
{e:"past",t:"Star Clocks",s:"Sailors and desert travelers kept time and seasons by the sky, long before clocks or phones.",q:"What did people mostly use stars for?",o:["Finding direction and judging seasons","Making electricity","Predicting football scores"],a:0,f:"Stars gave direction at night and marked the seasons for sailing, pearling and farming.",bk:["The Stars: A New Way to See Them","H. A. Rey","A friendly guide to learning constellations yourself."]},
{e:"now",t:"Hope Reaches Mars",s:"In February 2021 the UAE’s probe arrived at the Red Planet, making the UAE one of the few countries to reach Mars.",q:"What does the Hope probe study?",o:["Mars volcanoes","Mars atmosphere and weather","Mars underground water"],a:1,f:"Hope studies Mars’s atmosphere and weather across the whole day and year, something no earlier mission did in the same way.",bk:["Cosmos","Carl Sagan","A big, beautiful tour of the universe for curious minds."]},
{e:"now",t:"First Emirati in Space",s:"In September 2019 an Emirati travelled to the International Space Station.",q:"Who was the first Emirati astronaut in space?",o:["Sultan Al Neyadi","Hazza Al Mansouri","Mohammed Al Mulla"],a:1,f:"Hazza Al Mansouri flew in 2019. Later Sultan Al Neyadi spent six months on the ISS and did a spacewalk, an Arab first.",bk:["Astrophysics for People in a Hurry","Neil deGrasse Tyson","Short chapters on space, perfect for future astronauts."]},
{e:"now",t:"Clean Power",s:"The UAE built Barakah, a nuclear power plant, and huge solar parks to make electricity.",q:"Which clean-energy source did the UAE use for the Arab world’s first nuclear plant?",o:["Atoms (nuclear energy)","Burning wood","Ocean waves"],a:0,f:"Barakah opened its first reactor in 2020, the first commercial nuclear plant in the Arab world, alongside big solar projects.",bk:["The Boy Who Harnessed the Wind","William Kamkwamba","A true story of a teen who built power for his village."]},
{e:"future",t:"City on Mars",s:"The UAE has a long-term project called Mars 2117 to help humans live on the Red Planet.",q:"By which year does the UAE hope to help build a Mars city?",o:["2050","2117","3000"],a:1,f:"Mars 2117 aims for a settlement within about a hundred years, and Hope was an early step.",bk:["Red Mars","Kim Stanley Robinson","A novel about the first people who settle Mars."]},
{e:"future",t:"Moon Gateway",s:"The UAE is building an airlock for the Gateway, a small space station that will orbit the Moon.",q:"What will the UAE’s Gateway airlock be used for?",o:["Letting astronauts exit into space","Storing food only","Launching rockets from Earth"],a:0,f:"An airlock lets astronauts step out into space safely and keeps the air inside the station.",bk:["Project Hail Mary","Andy Weir","A fun space-science adventure full of problem solving."]},
{e:"future",t:"Asteroid Explorer",s:"A planned UAE spacecraft will visit asteroids between Mars and Jupiter, rocks left over from the early solar system.",q:"How many main-belt asteroids will it study?",o:["One","Seven","Seventy"],a:1,f:"The MBR Explorer plans to study seven asteroids and land on one of them.",bk:["A Brief History of Time","Stephen Hawking","A famous book on space, time and the big questions."]}];
const RANKS=[[0,"🌱 Curious Cadet"],[200,"🧭 Explorer"],[500,"🔬 Scientist"],[800,"🚀 Astronaut"]];
let S={pts:0,done:{},wrong:{},era:"past",name:""};
try{const v=localStorage.getItem("uaeq");if(v)S=Object.assign(S,JSON.parse(v))}catch(e){}
const save=()=>{try{localStorage.setItem("uaeq",JSON.stringify(S))}catch(e){}};
const $=i=>document.getElementById(i);
const doneCount=e=>Q.filter((q,i)=>q.e===e&&S.done[i]).length;
function pop(t){const d=document.createElement("div");d.className="pop";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1100)}
function hud(){
 $("pts").textContent=S.pts;
 let r=RANKS[0][1];RANKS.forEach(x=>{if(S.pts>=x[0])r=x[1]});$("rank").textContent=r;
 $("fill").style.width=Math.round(Object.keys(S.done).length/Q.length*100)+"%";
 $("badges").innerHTML=ERAS.map(e=>`<span class="b ${doneCount(e.id)===3?"on":""}">${e.icon} ${e.name} Master</span>`).join("");
 const all=Object.keys(S.done).length===Q.length;
 $("cert").classList.toggle("on",all);
 $("name").value=S.name||"";
 $("certline").textContent=all&&S.name?`🌟 ${S.name}, Science Explorer of the UAE! ${S.pts} points 🌟`:"";
}
function tabs(){
 $("tabs").innerHTML=ERAS.map(e=>`<button class="tab" role="tab" aria-selected="${S.era===e.id}" data-e="${e.id}">${e.icon} ${e.name} (${doneCount(e.id)}/3)</button>`).join("");
 $("intro").textContent=ERAS.find(e=>e.id===S.era).intro;
}
function list(){
 $("list").innerHTML=Q.map((q,i)=>q.e!==S.era?"":`<div class="q ${S.done[i]?"done":""}" id="q${i}">
 <div class="tag">Quest ${i%3+1}${S.done[i]?" · Complete ✅":""}</div><h2>${q.t}</h2><p>${q.s}</p><p><b>${q.q}</b></p>
 ${q.o.map((o,k)=>`<button class="opt ${S.done[i]&&k===q.a?"yes":""}" data-i="${i}" data-k="${k}" ${S.done[i]?"disabled":""}>${o}</button>`).join("")}
 ${S.done[i]?win(q):""}</div>`).join("");
}
function win(q){return `<div class="win"><b class="g">🎉 Reward unlocked!</b> ${q.f}<div class="book">📚 <b>Read next:</b> <i>${q.bk[0]}</i> by ${q.bk[1]}<br><small>${q.bk[2]}</small></div></div>`}
function render(){hud();tabs();list()}
$("tabs").onclick=e=>{const b=e.target.closest(".tab");if(b){S.era=b.dataset.e;save();render()}};
$("list").onclick=e=>{
 const b=e.target.closest(".opt");if(!b)return;
 const i=+b.dataset.i,k=+b.dataset.k,q=Q[i];
 if(k===q.a){const p=Math.max(100-40*(S.wrong[i]||0),20);S.pts+=p;S.done[i]=1;pop("+"+p);save();render()}
 else{S.wrong[i]=(S.wrong[i]||0)+1;b.classList.add("no");b.disabled=true;save()}
};
$("name").oninput=e=>{S.name=e.target.value.trim();save();$("certline").textContent=S.name?`🌟 ${S.name}, Science Explorer of the UAE! ${S.pts} points 🌟`:""};
$("reset").onclick=()=>{if(confirm("Reset all progress?")){S={pts:0,done:{},wrong:{},era:"past",name:""};save();render()}};
render();
</script>
</body>
</html>

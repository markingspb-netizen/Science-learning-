<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Science Reader</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#1f2a24;--mute:#5b6660;--line:#dfe5df;--brand:#3d7d2a;--brand2:#2f6420;--brandsoft:#e8f2e3;--gold:#c98a12;--bad:#c0392b;--good:#2e7d32;--hl:#fff3c4;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111613;--card:#1a211c;--ink:#e9efe9;--mute:#9fab9f;--line:#2c362e;--brand:#6abf4b;--brand2:#82d063;--brandsoft:#203320;--gold:#f0b44a;--bad:#ff7b6e;--good:#6fd36f;--hl:#3d3610;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111613;--card:#1a211c;--ink:#e9efe9;--mute:#9fab9f;--line:#2c362e;--brand:#6abf4b;--brand2:#82d063;--brandsoft:#203320;--gold:#f0b44a;--bad:#ff7b6e;--good:#6fd36f;--hl:#3d3610;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit}
a{color:var(--brand)}
/* header */
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px)}
.topin{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{text-align:left;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);cursor:pointer;background:none;border:0;padding:0}
.logo .mark{width:38px;height:38px;border-radius:10px;background:var(--brand);display:grid;place-items:center;font-size:20px}
.logo b{display:block;font-size:1.15rem;line-height:1.1}
.logo small{display:block;color:var(--mute);font-size:.72rem;letter-spacing:.04em;text-transform:uppercase}
.search{flex:1 1 260px;display:flex;gap:6px;max-width:440px;margin-left:auto}
.search input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.btn{padding:9px 16px;border-radius:8px;border:0;background:var(--brand);color:#fff;font-weight:700;cursor:pointer}
:root[data-theme="dark"] .btn{color:#0d1a0d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0d1a0d}}
.btn:hover{background:var(--brand2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.pts{font-weight:800;color:var(--gold);white-space:nowrap}
.banner{background:var(--brand);color:#fff;text-align:center;padding:14px 16px;font-size:1.05rem}
:root[data-theme="dark"] .banner{color:#0d1a0d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .banner{color:#0d1a0d}}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
/* carousel */
.car{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.slide{display:grid;grid-template-columns:1.1fr 1fr;min-height:280px}
.slide .txt{padding:26px 26px 22px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.kicker{font-size:.8rem;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.06em}
.slide h2{font-size:1.9rem;line-height:1.15;margin:2px 0}
.slide p{margin:0 0 10px;color:var(--mute)}
.art{display:grid;place-items:center;font-size:7rem;min-height:200px}
.carnav{display:flex;align-items:center;justify-content:space-between;background:#3a3a3a;padding:6px}
.carnav button{background:none;border:0;color:#fff;font-size:1.3rem;padding:4px 14px;cursor:pointer}
.dots{display:flex;gap:10px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff;display:block;cursor:pointer}
.dots i.on{background:#fff}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:1.5rem;line-height:1.2}
.stat span{color:var(--mute);font-size:.85rem}
.meter{height:6px;border-radius:6px;background:var(--line);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand)}
/* filters */
.secthead{display:flex;align-items:end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:22px 0 10px}
.secthead h3{margin:0;font-size:1.3rem}
select{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{flex:none;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:.9rem;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
:root[data-theme="dark"] .chip.on{color:#0d1a0d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{color:#0d1a0d}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgb(0 0 0/.08)}
.card .thumb{height:110px;display:grid;place-items:center;font-size:3.4rem;position:relative}
.badge{position:absolute;top:8px;right:8px;background:var(--card);color:var(--ink);font-size:.75rem;font-weight:800;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.badge.full{background:var(--good);color:#fff;border-color:var(--good)}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .tp{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--brand)}
.card h4{margin:0;font-size:1.02rem;line-height:1.3}
.card p{margin:0;font-size:.86rem;color:var(--mute);line-height:1.45}
.card .meta{margin-top:auto;padding-top:6px;font-size:.78rem;color:var(--mute)}
.empty{padding:30px;text-align:center;color:var(--mute)}
/* lesson */
.back{background:none;border:0;color:var(--brand);font-weight:700;cursor:pointer;padding:4px 0;margin-bottom:8px}
.steps{display:flex;gap:0;margin-bottom:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.steps div{flex:1;padding:9px 6px;text-align:center;font-size:.88rem;font-weight:700;color:var(--mute);border-right:1px solid var(--line)}
.steps div:last-child{border-right:0}
.steps div.on{background:var(--brand);color:#fff}
:root[data-theme="dark"] .steps div.on{color:#0d1a0d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .steps div.on{color:#0d1a0d}}
.steps div.ok{color:var(--good)}
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.paper{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.hero{height:170px;border-radius:12px;display:grid;place-items:center;font-size:5rem;margin-bottom:14px}
.paper h1{font-size:1.8rem;line-height:1.2;margin:4px 0 6px}
.dek{color:var(--mute);margin:0 0 12px;font-size:1.05rem}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tool{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:.9rem}
.tool.on{border-color:var(--brand);color:var(--brand);font-weight:700}
.article p{margin:0 0 14px;padding:6px 8px 6px 38px;position:relative;border-radius:8px;transition:background .4s}
.article p::before{content:attr(data-n);position:absolute;left:6px;top:7px;font-size:.75rem;font-weight:800;color:var(--brand);background:var(--brandsoft);border-radius:6px;padding:0 6px}
.article p.hl{background:var(--hl)}
.article.big{font-size:1.15rem}
.side{position:sticky;top:84px;display:flex;flex-direction:column;gap:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.box h3{margin:0 0 6px;font-size:1.05rem}
.box p{margin:0 0 10px;color:var(--mute);font-size:.92rem}
.q{border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px;background:var(--card)}
.q .lab{font-size:.75rem;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.05em}
.q h4{margin:4px 0 10px;font-size:1.02rem}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin:6px 0;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt .l{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:800}
.opt.sel{border-color:var(--brand);background:var(--brandsoft)}
.opt.sel .l{background:var(--brand);border-color:var(--brand);color:#fff}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.opt:disabled{cursor:default}
.fb{margin-top:8px;font-size:.92rem;font-weight:600}
.fb.r{color:var(--good)}.fb.w{color:var(--bad)}
.fb button{background:none;border:0;color:var(--brand);text-decoration:underline;cursor:pointer;font-weight:700;padding:0}
.score{text-align:center;padding:18px;border-radius:14px;border:2px solid var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent);margin-bottom:14px}
.score b{font-size:2.4rem;display:block;line-height:1.1;color:var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.pop{position:fixed;left:50%;top:30%;transform:translateX(-50%);font-size:2.4rem;font-weight:800;color:var(--gold);pointer-events:none;animation:up 1.2s forwards;z-index:9}
@keyframes up{to{transform:translate(-50%,-70px);opacity:0}}
.foot{color:var(--mute);font-size:.85rem;text-align:center;margin-top:30px}
.foot button{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer}
@media (max-width:820px){.lesson{grid-template-columns:1fr}.side{position:static}}
@media (max-width:640px){.slide{grid-template-columns:1fr}.art{min-height:140px;font-size:5rem;order:-1}.slide h2{font-size:1.45rem}.slide .txt{padding:16px}.stats{grid-template-columns:1fr 1fr 1fr;gap:6px}.stat{padding:10px}.stat b{font-size:1.2rem}.paper{padding:16px}.paper h1{font-size:1.45rem}.hero{height:130px;font-size:4rem}.logo small{display:none}.search{order:3;flex-basis:100%;max-width:none}}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <button class="logo" id="home" aria-label="Library home"><span class="mark">🔬</span><span><b>Science Reader</b><small>Real science stories · 110 articles</small></span></button>
  <form class="search" id="sform" role="search"><input id="sq" type="search" placeholder="Search by keyword, e.g. Mars, bees, volcano" aria-label="Search articles"><button class="btn">Search</button></form>
  <span class="pts" id="pts" title="Your points">⭐ 0</span>
</div></header>
<main id="app"></main>
<script>
const A=[];
// Format: {id, tp: topic, e: emoji, t: title, s: summary, p: [paragraphs], q: [[skill, question, [CORRECT, wrong, wrong, wrong], paragraph index]]}
// The correct option is always written first; the app shuffles options on screen.
A.push(
/* ===================== UAE SCIENCE ===================== */
{id:"u1",tp:"uae",e:"⛵",t:"The Lion of the Sea",s:"A navigator from Ras Al Khaimah used the stars to guide ships across the ocean 500 years ago.",
p:["More than 500 years ago, Julfar was a busy port on the coast of the Arabian Gulf. Today, the old port of Julfar is part of Ras Al Khaimah, one of the seven emirates of the UAE. Ships came and went from Julfar carrying dates, pearls, spices and cloth.",
"Around 1432, a boy named Ahmad ibn Majid was born in Julfar into a family of sailors. He grew up to become a famous navigator, a person who plans the route of a ship and guides it safely to the right place. People called him the ‘Lion of the Sea’.",
"Ibn Majid studied the stars, the winds, the coral reefs and the coasts from East Africa to India. He wrote everything he learned in books and poems, so that other sailors could travel safely. Archaeologists digging at Julfar today still find pottery from China, which shows how far its ships travelled."],
q:[["Detail","Where was Ahmad ibn Majid born?",["In Julfar, which is now part of Ras Al Khaimah","In a port in India","In East Africa","In China"],1],
["Vocabulary","In this article, what is a navigator?",["A person who plans a ship’s route and guides it","A person who builds ships","A person who sells pearls","A person who digs for old pottery"],1],
["Cause & effect","Why did Ibn Majid write books and poems about the sea?",["So that other sailors could travel safely","So that he could become rich","Because he wanted to stop sailing","Because the king ordered him to"],2]]},

{id:"u2",tp:"uae",e:"🦪",t:"One Breath Deep: The Pearl Divers",s:"Before oil, the Gulf was famous for pearls, collected by divers who held their breath.",
p:["Before oil was discovered, pearls were the treasure of the Gulf. Every summer, during the great diving season called al-ghous al-kabir, hundreds of boats left the coast and stayed at sea for about four months.",
"The divers had no oxygen tanks. Each diver put a clip called a fattam on his nose, held a heavy stone to sink quickly, and filled a basket with oysters on the seabed. When he needed air, he tugged a rope, and a partner on the boat, called the seib, pulled him up.",
"Only a few oysters held a pearl, so a crew might open thousands to find a handful of good ones. In the 1920s and 1930s, cheaper cultured pearls from Japan became popular, and the pearl trade of the Gulf slowly came to an end."],
q:[["Detail","What was the fattam used for?",["To close the diver’s nose","To open oysters","To pull the diver up","To carry the oysters"],1],
["Sequence","What did a diver do right after he needed air?",["He tugged the rope so the seib could pull him up","He put the fattam on his nose","He picked up the heavy stone","He opened the oysters"],1],
["Cause & effect","Why did the Gulf pearl trade come to an end?",["Cheaper cultured pearls from Japan became popular","The oysters all disappeared","Divers got oxygen tanks","Boats were not allowed to sail"],2]]},

{id:"u3",tp:"uae",e:"💧",t:"The Falaj: Water That Flows Without Pumps",s:"An ancient system carried water through the desert to oasis farms using only gravity.",
p:["Rain is rare in the desert, so how did oasis towns like Al Ain grow date palms and vegetables? The answer is the falaj, an ancient water system that works with no pumps at all. It uses only gravity, the force that pulls water downhill.",
"A falaj starts where there is water, near the mountains or deep underground. From there, gently sloping channels carry the water to farms and homes. Some channels run underground for kilometres so that the hot sun cannot evaporate the water on the way.",
"Families shared the water by time. Each farm got its turn, measured by the sun’s shadow during the day and by the stars at night. The aflaj (more than one falaj) of Al Ain are part of a UNESCO World Heritage site, and some still carry water today."],
q:[["Main idea","What is this article mostly about?",["How the falaj carried water to desert farms","How to build a swimming pool","Why it rains a lot in Al Ain","How pumps were invented"],0],
["Cause & effect","Why do some falaj channels run underground?",["So the hot sun cannot evaporate the water","So animals cannot drink the water","Because the ground is softer there","To make the water flow uphill"],1],
["Detail","How did families measure each farm’s turn for water at night?",["By the stars","By a clock","By a bell","By the moon’s colour"],2]]},

{id:"u4",tp:"uae",e:"🏛️",t:"Towers That Catch the Wind",s:"Long before air conditioning, wind towers called barjeel cooled houses in the UAE.",
p:["Long before air conditioning, houses in old Dubai, Sharjah and other towns had a clever cooling trick: the barjeel, or wind tower. You can still see many of them in the Al Fahidi Historical Neighbourhood in Dubai.",
"A barjeel rises above the roof and is open on all four sides at the top. Whichever way the breeze blows, the tower catches it and sends it down into the room below. At the same time, warm air inside the room is pushed out. The barjeel needs no electricity at all.",
"Why does moving air make us feel cooler? A breeze helps sweat evaporate from our skin. To evaporate means to change from a liquid into a gas and disappear into the air, and evaporation carries heat away from the body. It is the same reason you feel cold when you step out of a swimming pool on a windy day."],
q:[["Detail","Why does a barjeel have openings on all four sides?",["So it can catch the breeze from any direction","So people can climb inside","So birds can build nests","So rain can fall into the house"],1],
["Vocabulary","What does the word ‘evaporate’ mean in paragraph 3?",["To change from liquid into gas and disappear into the air","To freeze into ice","To become dirty","To fall like rain"],2],
["Inference","What powers a barjeel?",["Only the wind","Electricity","Solar panels","A gas engine"],1]]},

{id:"u5",tp:"uae",e:"🔴",t:"Hope Reaches Mars",s:"The UAE’s Hope probe travelled 7 months to become the first Arab mission to reach Mars.",
p:["On 20 July 2020, a rocket lifted off from Japan carrying the Emirates Mars Mission, a probe called Hope, or Al Amal in Arabic. It was designed and built by Emirati engineers working together with partners at American universities.",
"Hope travelled for about seven months and nearly 500 million kilometres. On 9 February 2021, it fired its engines to slow down and was captured by the gravity of Mars. The UAE became the first Arab country, and only the fifth in the world, to reach Mars.",
"Hope studies the atmosphere and weather of Mars across the whole day and through all the seasons of the year. No earlier mission had done this in the same way. Hope shares its data free with scientists around the world."],
q:[["Detail","What does the Hope probe study?",["The atmosphere and weather of Mars","Rocks under the ground on Mars","Life in the oceans of Mars","The moons of Jupiter"],2],
["Detail","About how long did Hope travel to reach Mars?",["About seven months","About seven days","About seven years","About seventy days"],1],
["Inference","Why did Hope fire its engines when it reached Mars?",["To slow down so Mars’s gravity could capture it","To speed up and fly past Mars","To land on the surface","To send a message to Japan"],1]]},

{id:"u6",tp:"uae",e:"👨‍🚀",t:"Emiratis in Orbit",s:"Two Emirati astronauts have lived on the International Space Station, and one walked in space.",
p:["In September 2019, Hazza Al Mansouri became the first Emirati to travel to space. He flew on a Russian Soyuz rocket and spent eight days on the International Space Station, a giant laboratory that circles Earth about every 90 minutes.",
"In 2023, Sultan Al Neyadi flew on a SpaceX rocket and lived on the station for about six months. He did science experiments, answered questions from students on Earth, and shared photos of the UAE from space.",
"In April 2023, Al Neyadi put on his spacesuit and worked outside the station for about seven hours. It was the first spacewalk ever made by an Arab astronaut."],
q:[["Detail","Who was the first Emirati to travel to space?",["Hazza Al Mansouri","Sultan Al Neyadi","Ahmad ibn Majid","Neil Armstrong"],0],
["Compare","How was Al Neyadi’s mission different from Al Mansouri’s?",["It lasted about six months instead of eight days","It went to the Moon instead of the station","It was shorter","It had no science experiments"],1],
["Vocabulary","What is a spacewalk, based on paragraph 3?",["Working outside a spacecraft in a spacesuit","Walking on the Moon","Exercising inside the station","Running on a treadmill on Earth"],2]]},

{id:"u7",tp:"uae",e:"⚛️",t:"Barakah: Power From Atoms",s:"The Arab world’s first nuclear power plant makes electricity without smoke.",
p:["On the coast of Abu Dhabi stands Barakah, the first nuclear power plant in the Arab world. Its name means ‘blessing’ in Arabic.",
"Inside each reactor, tiny uranium atoms split apart. This splitting is called nuclear fission, and it releases a huge amount of heat. The heat boils water into steam, and the steam spins giant turbines that make electricity. No fuel is burned, so the plant does not release smoke.",
"Barakah has four reactors. The last one began working in 2024. Together they can make up to a quarter of the UAE’s electricity, which helps the country use less oil and gas."],
q:[["Vocabulary","What is nuclear fission?",["The splitting of atoms that releases heat","The burning of oil","The spinning of a turbine","The cooling of water"],1],
["Sequence","What happens right after the heat boils the water?",["The steam spins turbines that make electricity","The uranium splits apart","Smoke goes into the air","The water turns into ice"],1],
["Detail","How much of the UAE’s electricity can Barakah make?",["Up to a quarter","All of it","Half of it","Only one percent"],2]]},

{id:"u8",tp:"uae",e:"🌙",t:"Rashid and the Moon",s:"A small UAE rover tried to land on the Moon. The landing failed, but the team kept going.",
p:["In December 2022, a small UAE rover named Rashid left Earth riding on a Japanese lander called Hakuto-R. Rashid weighed only about 10 kilograms and carried cameras and sensors to study moon dust.",
"In April 2023, the lander tried to touch down on the Moon. Its computer got confused about how high it was. It used up its fuel while it was still above the surface, and it crashed. Rashid never got to drive on the Moon.",
"The team did not give up. Engineers studied exactly what went wrong and started building Rashid 2. Almost every space agency in the world has had crashes, and each failure teaches scientists how to do better next time."],
q:[["Cause & effect","Why did the Hakuto-R lander crash?",["Its computer got confused about its height and it ran out of fuel","A meteor hit it","Rashid drove off too early","The rocket never left Earth"],1],
["Detail","What did the team do after the crash?",["Studied what went wrong and started building Rashid 2","Stopped all space missions","Sent Rashid back to Earth","Blamed the Japanese team"],2],
["Author’s purpose","What lesson does the author want readers to learn?",["Failures can teach us how to do better","Space is too dangerous to explore","Small rovers never work","Only big countries should explore space"],2]]},

{id:"u9",tp:"uae",e:"🌧️",t:"Seeding the Clouds",s:"The UAE uses planes and salt crystals to help clouds make more rain.",
p:["The UAE is one of the driest countries on Earth. It gets only about 100 millimetres of rain in a whole year, while some rainy countries get more than ten times that amount.",
"To help, the UAE uses cloud seeding. Weather experts watch the sky with radar to find suitable clouds. Then pilots fly planes into those clouds and release flares that spread tiny salt crystals.",
"Inside a cloud, tiny droplets of water stick to the salt crystals. The droplets join together and grow bigger and heavier. When they are heavy enough, they may fall to the ground as rain. Cloud seeding cannot make clouds appear from a clear sky, but it can help clouds release more water."],
q:[["Detail","What do the planes release into the clouds?",["Flares with tiny salt crystals","Ice cream","Water from the sea","Smoke"],1],
["Sequence","What happens after water droplets stick to the salt?",["They join, grow heavier and may fall as rain","They disappear","They turn into salt","They float higher into space"],2],
["Detail","What can cloud seeding NOT do?",["Make clouds appear from a clear sky","Help clouds release more water","Use salt crystals","Use planes"],2]]},

{id:"u10",tp:"uae",e:"☄️",t:"A Journey to Seven Asteroids",s:"The UAE plans a spacecraft that will visit seven asteroids and land on one.",
p:["Between Mars and Jupiter lies the asteroid belt, a huge ring of rocks. These rocks are leftovers from the time when the planets formed, about 4.6 billion years ago. Studying them is like looking at baby photos of the solar system.",
"The UAE is building a spacecraft called the MBR Explorer. It is planned to launch in 2028. It will use the gravity of planets to speed up, like a slingshot, and then fly past seven asteroids.",
"At the end of its journey, in 2034, the spacecraft plans to land on an asteroid called Justitia. Justitia is unusually red, which may mean it formed far out in the solar system before drifting closer to the Sun."],
q:[["Detail","Where is the asteroid belt?",["Between Mars and Jupiter","Between Earth and the Moon","Beyond Pluto","Inside the Sun"],0],
["Figurative language","Why does the author say studying asteroids is like looking at ‘baby photos’?",["Asteroids are leftovers from when the solar system was very young","Asteroids look like babies","Asteroids are very small","Babies like asteroids"],0],
["Inference","How many years after launch should the landing on Justitia happen?",["Six years","Two years","Ten years","One year"],2]]},

{id:"u11",tp:"uae",e:"🥬",t:"Farms That Grow Up, Not Out",s:"Vertical farms in Dubai grow vegetables on tall shelves using very little water.",
p:["Growing food in the desert takes a lot of water, and water is precious in the UAE. So the country is trying new ways to farm. One of them is the vertical farm.",
"In a vertical farm, plants grow indoors on shelves stacked high toward the ceiling. Instead of sunlight, LED lights give the plants the light they need. The plants grow without fields of soil, and the water is cleaned and reused again and again.",
"In 2022, a vertical farm called Bustanica opened near Dubai. It is one of the largest vertical farms in the world, and it says it uses about 95 percent less water than farming in open fields. Scientists think similar farms could one day feed astronauts on the Moon or Mars."],
q:[["Vocabulary","Why is it called a ‘vertical’ farm?",["The plants grow on shelves stacked up high","The farm is very wide","The plants grow upside down","The farm is on a mountain"],1],
["Detail","What gives the plants light in a vertical farm?",["LED lights","Sunlight through the roof","Fire","Moonlight"],1],
["Main idea","What is the main benefit of vertical farms in the desert?",["They use much less water","They make the weather cooler","They need more land","They grow only flowers"],2]]},

/* ===================== SPACE ===================== */
{id:"s1",tp:"space",e:"☀️",t:"Our Star, the Sun",s:"The Sun is a giant ball of hot gas that gives Earth light and warmth.",
p:["The Sun is a star, just like the stars we see at night. It looks much bigger and brighter only because it is much closer to us. The Sun is about 4.6 billion years old.",
"The Sun is a giant ball of hot gas, mostly hydrogen and helium. Deep in its core, hydrogen atoms are squeezed together so hard that they join to make helium. This process, called fusion, releases enormous amounts of energy as light and heat.",
"Light from the Sun travels very fast, but the Sun is so far away that its light takes about eight minutes to reach Earth. Without the Sun’s light and warmth, plants could not grow and life on Earth could not exist."],
q:[["Detail","Why does the Sun look bigger than other stars?",["It is much closer to us","It is the biggest star in the universe","It is made of fire","It is younger"],0],
["Vocabulary","What is fusion?",["Atoms joining together and releasing energy","Gas cooling down","Light bouncing off the Moon","A kind of planet"],1],
["Detail","How long does sunlight take to reach Earth?",["About eight minutes","About eight seconds","About eight hours","About eight days"],2]]},

{id:"s2",tp:"space",e:"🌗",t:"Why the Moon Changes Shape",s:"The Moon does not really change. We see different parts of its sunlit side.",
p:["Some nights the Moon is a thin curve, and other nights it is a full, round circle. But the Moon itself never changes shape. The Moon does not make its own light. It shines because it reflects light from the Sun.",
"One half of the Moon is always lit by the Sun. As the Moon travels around Earth, we see different amounts of that bright half. These different shapes are called phases. When we see the whole bright half, it is a full moon. When we can hardly see it at all, it is a new moon.",
"The Moon takes about 29.5 days to go through all its phases. Long ago, people used this cycle as a calendar. The Islamic calendar still begins each month when the thin new crescent appears."],
q:[["Detail","Why does the Moon shine?",["It reflects light from the Sun","It makes its own light","It is on fire","It has electric lights"],0],
["Vocabulary","What are the Moon’s ‘phases’?",["The different shapes of the Moon we see","Craters on the Moon","Rocks brought back from the Moon","The Moon’s gravity"],1],
["Detail","About how long does a full cycle of phases take?",["About 29.5 days","About one week","About one year","About 24 hours"],2]]},

{id:"s3",tp:"space",e:"🚀",t:"Footprints on the Moon",s:"In 1969, Apollo 11 landed the first humans on the Moon.",
p:["On 20 July 1969, millions of people around the world watched their televisions in amazement. The American spacecraft Apollo 11 had landed on the Moon.",
"Three astronauts went on the mission. Neil Armstrong and Buzz Aldrin landed on the surface in a small craft called the Eagle. Michael Collins stayed in orbit around the Moon, waiting to take them home. When Armstrong stepped onto the dusty ground, he said: ‘That’s one small step for man, one giant leap for mankind.’",
"The astronauts collected rocks and soil and set up experiments. Because the Moon has no wind or rain, their footprints may stay there for millions of years."],
q:[["Detail","Who stayed in orbit while the others landed?",["Michael Collins","Neil Armstrong","Buzz Aldrin","The Eagle"],1],
["Cause & effect","Why might the footprints last for millions of years?",["The Moon has no wind or rain","The astronauts covered them","The ground is made of glue","Robots protect them"],2],
["Detail","When did Apollo 11 land on the Moon?",["20 July 1969","1 January 1900","20 July 2019","25 December 1960"],0]]},

{id:"s4",tp:"space",e:"🕳️",t:"Black Holes: Where Light Cannot Escape",s:"Black holes have gravity so strong that nothing, not even light, can get out.",
p:["A black hole is a place in space where gravity pulls so strongly that nothing can escape, not even light. Because no light comes out, a black hole looks completely black.",
"Many black holes form when a huge star runs out of fuel and collapses. All its matter gets squeezed into a tiny space. The border around a black hole is called the event horizon. Anything that crosses it can never come back out.",
"For a long time, no one had ever seen a black hole. Then, in 2019, scientists using telescopes all over the world shared the first picture of one. It showed a dark centre surrounded by a glowing ring of hot gas."],
q:[["Main idea","What makes a black hole special?",["Its gravity is so strong that even light cannot escape","It is the brightest object in space","It is a hole in Earth","It is made of black rock"],0],
["Vocabulary","What is the event horizon?",["The border around a black hole that nothing can come back from","The place where stars are born","A type of telescope","The edge of the solar system"],1],
["Detail","What did the first picture of a black hole show?",["A dark centre with a glowing ring of hot gas","A bright white star","A planet with rings","Nothing at all"],2]]},

{id:"s5",tp:"space",e:"🔭",t:"The Golden Eye in Space",s:"The James Webb Space Telescope sees the universe in infrared light.",
p:["The James Webb Space Telescope was launched on 25 December 2021. It is the largest space telescope ever built. Its main mirror is 6.5 metres wide and made of 18 pieces covered with a thin layer of gold.",
"Webb sees infrared light, a kind of light that our eyes cannot see but that we can feel as heat. Infrared light can pass through clouds of dust in space. This lets Webb see stars being born and galaxies that formed long ago.",
"Because Webb looks at heat, it must stay very cold. It has a giant sunshield the size of a tennis court, and it sits about 1.5 million kilometres from Earth, far from Earth’s warmth."],
q:[["Detail","What covers Webb’s mirror pieces?",["A thin layer of gold","Silver paint","Glass only","Ice"],0],
["Vocabulary","What is infrared light?",["Light our eyes cannot see that we feel as heat","Very bright blue light","Light from a torch","Light that only works at night"],1],
["Cause & effect","Why does Webb have a giant sunshield?",["Because it must stay very cold to see heat","To make shade for astronauts","To collect solar power","To protect it from rain"],2]]},

{id:"s6",tp:"space",e:"🤖",t:"Robots on Mars",s:"The Perseverance rover and the helicopter Ingenuity explored Mars together.",
p:["On 18 February 2021, NASA’s rover Perseverance landed in Jezero Crater on Mars. Scientists believe a lake filled this crater billions of years ago. If tiny living things ever existed on Mars, signs of them might be hidden in the rocks there.",
"Perseverance drills into rocks and stores small samples in tubes. A future mission is planned to bring them back to Earth so scientists can study them in laboratories.",
"Perseverance did not travel alone. Under its belly it carried Ingenuity, a small helicopter. In April 2021, Ingenuity made the first powered flight on another planet. That was hard, because the air on Mars is very thin, so its blades had to spin very fast."],
q:[["Cause & effect","Why did scientists choose Jezero Crater?",["A lake may have filled it long ago, so signs of life might be there","It is the hottest place on Mars","It is closest to Earth","It has the most sand"],0],
["Detail","What does Perseverance do with rock samples?",["Stores them in tubes for a future mission to bring back","Throws them away","Eats them for energy","Sends them to Jupiter"],1],
["Cause & effect","Why did Ingenuity’s blades have to spin very fast?",["Because the air on Mars is very thin","Because Mars is very hot","Because it was heavy with rocks","Because it was racing the rover"],2]]},

{id:"s7",tp:"space",e:"🪐",t:"The Rings of Saturn",s:"Saturn’s rings are made of billions of pieces of ice and rock.",
p:["Saturn is the sixth planet from the Sun and the second largest planet in our solar system. It is famous for its beautiful rings.",
"From far away, the rings look solid, like a flat disc. But they are made of billions of separate pieces of ice and rock. Some pieces are as small as grains of sand, and others are as large as houses. All of them travel around Saturn together.",
"Saturn is a gas giant, made mostly of hydrogen and helium. It has no solid surface to stand on. It is so light for its size that scientists say it would float if you could find a bathtub big enough."],
q:[["Detail","What are Saturn’s rings made of?",["Billions of pieces of ice and rock","One solid sheet of metal","Clouds of smoke","Coloured light"],1],
["Vocabulary","What is a ‘gas giant’?",["A huge planet made mostly of gas","A very tall person","A cloud on Earth","A small rocky moon"],2],
["Detail","What do scientists say Saturn would do in a giant bathtub?",["Float","Sink","Melt","Explode"],2]]},

{id:"s8",tp:"space",e:"🛰️",t:"A Home in Orbit",s:"The International Space Station has had people living on it since 2000.",
p:["The International Space Station, or ISS, is the largest object people have ever built in space. Countries including the USA, Russia, Japan, Canada and many in Europe worked together to build it, piece by piece.",
"The station orbits about 400 kilometres above Earth and circles the planet about every 90 minutes. That means astronauts on board can see around 16 sunrises and sunsets every day.",
"People have lived on the ISS without a break since November 2000. In space, everything floats, so astronauts sleep in bags tied to the wall and exercise for about two hours a day to keep their muscles and bones strong."],
q:[["Detail","How often does the ISS circle Earth?",["About every 90 minutes","Once a day","Once a year","Every 10 minutes"],1],
["Cause & effect","Why do astronauts exercise about two hours a day?",["To keep their muscles and bones strong","Because they are bored","To make the station move","To get to the Moon faster"],2],
["Inference","Why do astronauts sleep in bags tied to the wall?",["Because everything floats in space","Because the beds are broken","Because it is cold","Because walls are softer"],2]]},

{id:"s9",tp:"space",e:"💗",t:"Little Pluto’s Big Heart",s:"Pluto became a dwarf planet in 2006 and showed a heart shape in 2015.",
p:["For 76 years, students learned that Pluto was the ninth planet. But in 2006, astronomers decided that Pluto should be called a dwarf planet instead.",
"Why? A full planet must clear its path around the Sun of other objects. Pluto shares its path with many other icy bodies in a region called the Kuiper Belt, so it does not meet this rule.",
"In July 2015, the spacecraft New Horizons flew past Pluto after a journey of nine years. Its photos amazed everyone: they showed mountains of ice and a huge, bright region shaped like a heart."],
q:[["Detail","What did astronomers decide in 2006?",["Pluto should be called a dwarf planet","Pluto is the biggest planet","Pluto does not exist","Pluto is a moon of Earth"],0],
["Cause & effect","Why is Pluto not a full planet?",["It shares its path with many other icy bodies","It is too hot","It has no moons","It is too close to the Sun"],1],
["Detail","What shape did New Horizons see on Pluto?",["A heart","A star","A square","A face"],2]]},

{id:"s10",tp:"space",e:"☄️",t:"Comets: Dirty Snowballs",s:"Comets are balls of ice and dust that grow glowing tails near the Sun.",
p:["Comets are sometimes called ‘dirty snowballs’ because they are made of ice, dust and rock. Most of the time they are far from the Sun, frozen and dark.",
"When a comet comes closer to the Sun, the heat turns some of its ice into gas. The gas and dust form a glowing cloud and long tails. A comet’s tails always point away from the Sun, because sunlight and the solar wind push them.",
"The most famous comet is Halley’s Comet. It comes back near Earth about every 76 years. It was last seen in 1986, and it will return in 2061."],
q:[["Vocabulary","Why are comets called ‘dirty snowballs’?",["They are made of ice mixed with dust and rock","They are white and clean","They fall as snow","They are cold planets"],0],
["Cause & effect","What makes a comet grow tails?",["The Sun’s heat turns some of its ice into gas","It hits a planet","It spins very fast","It catches fire"],1],
["Detail","When will Halley’s Comet return?",["In 2061","In 2030","Never","Every year"],2]]},

/* ===================== EARTH & WEATHER ===================== */
{id:"e1",tp:"earth",e:"🌋",t:"Getting Ready for Earthquakes",s:"Moving plates cause earthquakes. Warning systems give people a few precious seconds.",
p:["The ground under our feet seems still, but Earth’s outer layer is broken into giant pieces called tectonic plates. These plates move very slowly, only a few centimetres a year. Sometimes they get stuck, and pressure builds up. When they suddenly slip, the ground shakes. That is an earthquake.",
"Scientists measure earthquakes with machines called seismometers. Earthquake waves travel through the ground. The fastest waves are usually gentle, and the stronger shaking arrives a little later.",
"Countries like Japan use this difference to warn people. Sensors notice the first waves, and computers quickly send alerts to phones, trains and schools. A warning of just a few seconds gives people time to hide under a table or stop a train."],
q:[["Cause & effect","What causes an earthquake?",["Tectonic plates suddenly slipping","Strong winds","Heavy rain","The Moon’s light"],0],
["Vocabulary","What is a seismometer?",["A machine that measures earthquakes","A type of rock","A warning siren","A weather balloon"],1],
["Detail","How can a few seconds of warning help people?",["They can hide under a table or stop a train","They can stop the earthquake","They can move to another country","They can fix the plates"],2]]},

{id:"e2",tp:"earth",e:"🌋",t:"Inside a Volcano",s:"Volcanoes form where hot melted rock rises from deep inside Earth.",
p:["Deep under Earth’s surface, it is so hot that some rock melts. This melted rock is called magma. Because magma is lighter than the solid rock around it, it slowly rises upward.",
"When magma reaches the surface through an opening, a volcano erupts. Once the melted rock comes out of the ground, it is called lava. Some eruptions are gentle rivers of lava, and others are huge explosions of ash and gas.",
"Many volcanoes lie around the Pacific Ocean, in a large circle called the Ring of Fire. Volcanoes can be dangerous, but they also create new land. The islands of Hawaii were built by volcanoes."],
q:[["Vocabulary","What is the difference between magma and lava?",["Magma is under the ground; lava has come out onto the surface","Magma is cold; lava is hot","Lava is a gas; magma is a liquid","There is no difference"],1],
["Cause & effect","Why does magma rise upward?",["It is lighter than the solid rock around it","The wind pulls it","People pump it","The Moon pulls it"],0],
["Detail","What is one good thing volcanoes can do?",["Create new land, like Hawaii","Stop earthquakes","Make rain","Cool the planet forever"],2]]},

{id:"e3",tp:"earth",e:"💦",t:"The Never-Ending Water Cycle",s:"Water travels from oceans to clouds to rain and back again.",
p:["The water you drink today may once have been drunk by a dinosaur! That is because Earth’s water moves around and around in a cycle that never ends.",
"First, the Sun heats water in oceans, lakes and rivers. Some of it turns into an invisible gas called water vapour and rises into the air. This is evaporation. High in the sky, the air is cooler, so the vapour turns back into tiny droplets that form clouds. This is condensation.",
"When the droplets in a cloud join together and become heavy, they fall as rain, snow or hail. This is precipitation. The water flows into rivers and oceans or soaks into the ground, and the cycle starts again."],
q:[["Sequence","What happens right after evaporation?",["Water vapour cools and forms clouds (condensation)","Rain falls","Water flows into rivers","The Sun goes down"],1],
["Vocabulary","What is precipitation?",["Water falling from clouds as rain, snow or hail","Water turning into vapour","A type of cloud","Water in the ground"],2],
["Inference","Why might your water once have been drunk by a dinosaur?",["Earth’s water is reused again and again in the cycle","Dinosaurs still live in rivers","Water is made in factories","Dinosaurs made the oceans"],0]]},

{id:"e4",tp:"earth",e:"⚡",t:"Lightning and Thunder",s:"Lightning is a giant spark of electricity. Thunder is the sound it makes.",
p:["Lightning is a giant spark of electricity. Inside a storm cloud, tiny pieces of ice bump into each other and build up electric charge. When the charge becomes strong enough, a huge spark jumps between the cloud and the ground, or between clouds.",
"A bolt of lightning can heat the air to around 30,000 degrees Celsius, which is hotter than the surface of the Sun. The air heats so quickly that it expands with a boom. That boom is thunder.",
"Light travels much faster than sound, so we see lightning before we hear thunder. Count the seconds between the flash and the boom: every three seconds means the lightning is about one kilometre away."],
q:[["Cause & effect","What makes the sound of thunder?",["Air heating very quickly and expanding","Clouds crashing together","Rain hitting the ground","Wind blowing over mountains"],1],
["Cause & effect","Why do we see lightning before we hear thunder?",["Light travels much faster than sound","Thunder happens later","Our eyes are faster than ears","Sound is blocked by clouds"],2],
["Detail","If you count six seconds between flash and boom, about how far away is the lightning?",["About two kilometres","About six kilometres","About one metre","About twenty kilometres"],2]]},

{id:"e5",tp:"earth",e:"🌀",t:"Hurricanes: Giant Spinning Storms",s:"Hurricanes form over warm oceans and have a calm eye in the middle.",
p:["A hurricane is a huge spinning storm with powerful winds and heavy rain. In different parts of the world it has different names. Over the Atlantic it is called a hurricane, in the western Pacific it is called a typhoon, and in the Indian Ocean it is called a cyclone.",
"These storms form over warm ocean water. Warm, wet air rises, cools and forms clouds, which releases more heat and pulls in more air. The storm grows bigger and starts to spin.",
"In the middle of a hurricane is a strange calm area called the eye. Inside the eye, the sky can be clear and the wind gentle. But all around it is the eyewall, where the winds are strongest."],
q:[["Detail","Where do hurricanes form?",["Over warm ocean water","Over cold mountains","In deserts","At the North Pole"],0],
["Vocabulary","What is a typhoon?",["The name for a hurricane in the western Pacific","A small rain cloud","A calm day","A type of earthquake"],0],
["Detail","Where are the strongest winds in a hurricane?",["In the eyewall around the eye","In the eye","Far outside the storm","Under the ground"],2]]},

{id:"e6",tp:"earth",e:"🏜️",t:"What Makes a Desert?",s:"A desert is defined by low rainfall, not by heat. Antarctica is the biggest desert.",
p:["When you think of a desert, you probably imagine hot sand dunes, like those near Liwa in the UAE. But scientists define a desert by how little rain or snow it gets, not by how hot it is. Usually, a desert gets less than 250 millimetres of rain in a year.",
"That means the largest desert on Earth is not hot at all. It is Antarctica, which is covered in ice but gets very little new snow each year.",
"Desert plants and animals have clever ways to survive. Some plants have very long roots to find water deep underground. Many desert animals rest in burrows during the hot day and come out at night when it is cooler."],
q:[["Main idea","How do scientists decide if a place is a desert?",["By how little rain or snow it gets","By how hot it is","By how much sand it has","By how many camels live there"],0],
["Detail","What is the largest desert on Earth?",["Antarctica","The Sahara","Liwa","The Moon"],1],
["Detail","Why do many desert animals come out at night?",["It is cooler then","They cannot see in the day","They are afraid of birds","There is more rain at night"],2]]},

{id:"e7",tp:"earth",e:"🌍",t:"Why Do We Have Seasons?",s:"Seasons happen because Earth is tilted, not because it gets closer to the Sun.",
p:["Many people think summer happens when Earth is closer to the Sun. That is not true! Earth’s distance from the Sun changes only a little during the year.",
"Seasons happen because Earth is tilted. Its axis, the imaginary line it spins around, leans at about 23.5 degrees. As Earth travels around the Sun, first one half and then the other half leans toward the Sun.",
"When your half of Earth leans toward the Sun, sunlight hits it more directly and days are longer, so it is summer. When your half leans away, sunlight is weaker and days are shorter, so it is winter. That is why when it is summer in the UAE, it is winter in Australia."],
q:[["Cause & effect","What causes the seasons?",["The tilt of Earth’s axis","Earth getting closer to the Sun","Clouds blocking the Sun","The Moon’s light"],1],
["Vocabulary","What is Earth’s axis?",["The imaginary line Earth spins around","The equator","The North Pole’s ice","Earth’s path around the Sun"],1],
["Inference","Why is it winter in Australia when it is summer in the UAE?",["They are on halves of Earth that lean in opposite directions","Australia is closer to the Sun","The UAE has more sand","Australia has no sunlight"],2]]},

{id:"e8",tp:"earth",e:"🌈",t:"How a Rainbow Is Made",s:"Raindrops split white sunlight into all its colours.",
p:["Sunlight looks white, but it is really a mixture of all the colours of the rainbow: red, orange, yellow, green, blue, indigo and violet.",
"When sunlight enters a raindrop, it bends. Each colour bends by a slightly different amount, so the colours spread apart. The light then bounces off the back of the drop and comes out toward our eyes. Millions of raindrops together make the bright arc we call a rainbow.",
"To see a rainbow, the Sun must be behind you and the rain in front of you. That is why rainbows often appear in the late afternoon, after a shower, when the Sun is low in the sky."],
q:[["Detail","What is white sunlight made of?",["A mixture of all the colours","Only yellow light","Heat and nothing else","Water"],0],
["Cause & effect","Why do the colours spread apart in a raindrop?",["Each colour bends by a slightly different amount","The raindrop paints them","The wind blows them apart","The colours are different temperatures"],1],
["Detail","Where must the Sun be for you to see a rainbow?",["Behind you","In front of you","Straight above you","Under the ground"],2]]},

{id:"e9",tp:"earth",e:"🌊",t:"Tsunami: The Harbour Wave",s:"Undersea earthquakes can push the ocean into giant, fast waves.",
p:["The word tsunami comes from Japanese and means ‘harbour wave’. A tsunami is a series of huge waves, usually caused by an earthquake under the sea.",
"When the sea floor suddenly moves up or down, it pushes a massive amount of water. In deep ocean, a tsunami can travel as fast as a jet plane, but it may be less than one metre tall, so ships hardly notice it. As it reaches shallow water near the coast, it slows down and grows much taller.",
"One warning sign is when the sea suddenly pulls back far from the beach. People should then move to high ground at once. In 2004, a tsunami in the Indian Ocean affected many countries, and now there are warning systems to help protect people."],
q:[["Vocabulary","What does the word tsunami mean in Japanese?",["Harbour wave","Big storm","Angry sea","Water mountain"],0],
["Cause & effect","Why does a tsunami grow taller near the coast?",["It slows down in shallow water","The wind pushes it","It gets more rain","The Moon pulls it"],1],
["Detail","What should people do if the sea suddenly pulls back from the beach?",["Move to high ground at once","Walk out to collect shells","Go swimming","Wait to watch the wave"],2]]}
);

A.push(
/* ===================== HUMAN BODY ===================== */
{id:"b1",tp:"body",e:"❤️",t:"Your Amazing Heart",s:"Your heart is a muscle that pumps blood around your body all day and night.",
p:["Your heart is a muscle about the size of your fist. It works every second of your life, even while you sleep. It beats about 100,000 times every day.",
"The heart has four rooms, called chambers. The right side pumps blood to the lungs to pick up oxygen. The left side pumps that oxygen-rich blood to the rest of your body through tubes called arteries. Blood returns to the heart through veins.",
"Your heart beats faster when you run or play, because your muscles need more oxygen. Regular exercise makes the heart stronger, just like it makes your arm and leg muscles stronger."],
q:[["Detail","How many chambers does the heart have?",["Four","Two","Six","One"],1],
["Vocabulary","What are arteries?",["Tubes that carry blood from the heart to the body","Parts of the lungs","Bones in the chest","Chambers of the heart"],1],
["Cause & effect","Why does your heart beat faster when you run?",["Your muscles need more oxygen","Your heart gets scared","Your blood gets colder","Your lungs stop working"],2]]},

{id:"b2",tp:"body",e:"🧠",t:"The Brain: Your Body’s Control Centre",s:"Billions of nerve cells in your brain send messages that control everything you do.",
p:["Your brain controls everything you do, from breathing and walking to thinking and dreaming. It weighs only about 1.4 kilograms in an adult, but it is the most complex organ in the body.",
"The brain is made of about 86 billion nerve cells called neurons. Neurons send tiny electrical and chemical messages to each other very quickly. When you learn something new, connections between neurons become stronger.",
"Even though the brain is only a small part of your body weight, it uses about 20 percent of your body’s energy. That is one reason why eating well and sleeping enough help you think clearly."],
q:[["Vocabulary","What are neurons?",["Nerve cells that send messages","Blood cells","Bones of the skull","Muscles in the arm"],1],
["Detail","What happens when you learn something new?",["Connections between neurons become stronger","Your brain gets lighter","Neurons stop working","Your heart beats slower"],1],
["Detail","About how much of the body’s energy does the brain use?",["About 20 percent","About 1 percent","About 90 percent","None"],2]]},

{id:"b3",tp:"body",e:"🦴",t:"Bones: The Living Frame",s:"Your skeleton holds you up, protects your organs and keeps growing.",
p:["Without bones, you would flop like a jellyfish! Your skeleton holds your body up, helps you move and protects soft organs. Your skull protects your brain, and your ribs protect your heart and lungs.",
"A newborn baby has around 300 bones. As the baby grows, some of them join together. By the time a person is an adult, they have 206 bones.",
"Bones are alive. They grow, and they can repair themselves when they break. The smallest bone in your body is in your ear and is about the size of a grain of rice. Calcium, found in foods like milk and yoghurt, helps keep bones strong."],
q:[["Detail","What do your ribs protect?",["Your heart and lungs","Your brain","Your feet","Your ears"],0],
["Cause & effect","Why does an adult have fewer bones than a baby?",["Some bones join together as the baby grows","Adults lose bones in accidents","Babies have extra fingers","Bones melt over time"],1],
["Detail","Where is the smallest bone in your body?",["In your ear","In your toe","In your nose","In your finger"],2]]},

{id:"b4",tp:"body",e:"😴",t:"Why We Need Sleep",s:"Sleep helps your brain store memories and your body repair itself.",
p:["You spend about one third of your life asleep. Sleep is not wasted time. While you sleep, your body is busy repairing muscles and growing.",
"Your brain is busy too. During sleep, it sorts through what happened during the day and stores important memories. That is why sleeping well after studying can help you remember what you learned.",
"Doctors say children aged 6 to 12 need 9 to 12 hours of sleep each night, and teenagers need 8 to 10 hours. Screens can make it harder to fall asleep, so it helps to put phones and tablets away before bedtime."],
q:[["Main idea","What is the main idea of the article?",["Sleep helps the body and brain in important ways","Sleep is a waste of time","Only babies need sleep","Phones help us sleep"],0],
["Detail","What does the brain do with memories during sleep?",["Sorts and stores important memories","Deletes all of them","Sends them to the heart","Nothing"],1],
["Detail","How much sleep do children aged 6 to 12 need?",["9 to 12 hours","2 to 4 hours","5 to 6 hours","15 to 18 hours"],2]]},

{id:"b5",tp:"body",e:"💉",t:"How Vaccines Train Your Body",s:"Vaccines teach the immune system to recognise germs before they make you sick.",
p:["Your body has a defence army called the immune system. When a germ gets in, the immune system learns to recognise it and fight it. The next time the same germ appears, your body can fight it much faster.",
"A vaccine uses this idea. It shows the immune system a weakened, harmless or partial version of a germ, so the body can practise without getting really sick.",
"In 1796, an English doctor named Edward Jenner made the first vaccine, against a terrible disease called smallpox. Thanks to vaccines used all around the world, smallpox was declared completely wiped out in 1980."],
q:[["Vocabulary","What is the immune system?",["The body’s defence against germs","A kind of medicine","The body’s bones","A machine in a hospital"],0],
["Detail","What does a vaccine show the immune system?",["A weakened, harmless or partial version of a germ","A strong, dangerous germ","A picture of a doctor","Nothing"],1],
["Detail","What happened to smallpox in 1980?",["It was declared completely wiped out","It was discovered","The first vaccine was made","It spread to every country"],2]]},

{id:"b6",tp:"body",e:"🦷",t:"Teeth: Built Twice",s:"You grow two sets of teeth covered by the hardest material in your body.",
p:["Humans grow two sets of teeth. Children have 20 baby teeth, which start to fall out at around age six. They are replaced by adult teeth, and most adults have 32.",
"The outer layer of a tooth is called enamel. It is the hardest substance in the human body, even harder than bone. But enamel cannot grow back once it is damaged.",
"Tiny bacteria in your mouth feed on sugar and make acid. The acid can make holes in enamel, called cavities. Brushing twice a day and eating less sugar help protect your teeth for life."],
q:[["Detail","How many baby teeth do children have?",["20","32","10","50"],0],
["Vocabulary","What is enamel?",["The hard outer layer of a tooth","A type of bacteria","A tooth doctor","The root of a tooth"],1],
["Cause & effect","What causes cavities?",["Acid made by bacteria feeding on sugar","Drinking water","Brushing your teeth","Eating vegetables"],2]]},

{id:"b7",tp:"body",e:"🧼",t:"The Power of Hand Washing",s:"Soap and water remove germs, and one doctor proved it saves lives.",
p:["Our hands touch many things, and they pick up germs that we cannot see. When we touch our eyes, nose or mouth, those germs can get inside our bodies and make us ill.",
"Soap is a powerful tool. Its molecules grab onto oil and dirt and break apart the outer layer of many germs. Then water washes everything away. Doctors recommend scrubbing your hands with soap for at least 20 seconds.",
"In the 1840s, a doctor in Vienna named Ignaz Semmelweis noticed that fewer patients died when doctors washed their hands. Many people laughed at his idea back then, but today we know he was right."],
q:[["Cause & effect","How do germs on our hands get into our bodies?",["When we touch our eyes, nose or mouth","Through our hair","Through our shoes","They cannot get in"],0],
["Detail","How long should you scrub your hands with soap?",["At least 20 seconds","1 second","5 minutes","1 hour"],1],
["Detail","What did Ignaz Semmelweis notice?",["Fewer patients died when doctors washed their hands","Soap makes people ill","Germs are good for us","Water is dangerous"],2]]},

{id:"b8",tp:"body",e:"🫁",t:"Every Breath You Take",s:"Your lungs swap oxygen and carbon dioxide thousands of times a day.",
p:["Every cell in your body needs oxygen to make energy. Your lungs bring oxygen in and take a waste gas, carbon dioxide, out. You breathe more than 20,000 times a day without even thinking about it.",
"When you breathe in, a dome-shaped muscle under your lungs called the diaphragm moves down, and air rushes in. When it moves up again, air is pushed out.",
"Inside the lungs are millions of tiny air sacs called alveoli. They are wrapped in tiny blood vessels. Oxygen passes from the air sacs into the blood, and carbon dioxide passes from the blood into the air sacs to be breathed out."],
q:[["Detail","What waste gas do the lungs remove?",["Carbon dioxide","Oxygen","Water","Helium"],0],
["Vocabulary","What is the diaphragm?",["A dome-shaped muscle under the lungs","A tiny air sac","A bone in the chest","A blood vessel"],1],
["Sequence","What happens to oxygen in the alveoli?",["It passes into the blood","It is breathed out","It turns into water","It stays there forever"],2]]},

{id:"b9",tp:"body",e:"✋",t:"Skin: Your Biggest Organ",s:"Your skin protects you, controls your temperature and renews itself.",
p:["What is the largest organ of the human body? It is your skin! In an adult, it would cover about two square metres if you could spread it flat.",
"Skin is a protective wall. It keeps germs out and keeps water in. It also helps control your temperature. When you are hot, you sweat, and as the sweat evaporates it cools you down.",
"Your skin is always renewing itself. The outer layer is made of dead cells that rub off all the time and are replaced by new ones from below. Skin also contains nerves that let you feel touch, heat, cold and pain."],
q:[["Detail","What is the largest organ of the human body?",["The skin","The brain","The heart","The lungs"],0],
["Cause & effect","How does sweating help you?",["Evaporating sweat cools you down","It makes you warmer","It keeps germs inside","It makes skin thicker"],1],
["Detail","What lets your skin feel touch and heat?",["Nerves","Bones","Hair only","Sweat"],2]]},

/* ===================== ANIMALS ===================== */
{id:"a1",tp:"animals",e:"🐪",t:"Camels: Built for the Desert",s:"From humps to eyelashes, camels are perfectly designed for desert life.",
p:["Camels have lived alongside people in Arabia for thousands of years. They are sometimes called ‘ships of the desert’ because they can carry heavy loads across the sand for long distances.",
"Many people think a camel’s hump is full of water. In fact, the hump stores fat. When food is hard to find, the camel’s body can use this fat for energy. Camels can also drink a very large amount of water very quickly when they find it.",
"Camels have other clever features. Two rows of long eyelashes protect their eyes from sand. They can close their nostrils during sandstorms. Their wide, padded feet stop them from sinking into soft sand."],
q:[["Detail","What does a camel’s hump store?",["Fat","Water","Milk","Sand"],1],
["Detail","How do camels protect their eyes from sand?",["Two rows of long eyelashes","Sunglasses","Closing their eyes all day","Living in caves"],2],
["Cause & effect","Why don’t camels sink into soft sand?",["Their feet are wide and padded","They are very light","They walk only on rocks","They fly over it"],2]]},

{id:"a2",tp:"animals",e:"🦌",t:"The Return of the Arabian Oryx",s:"Once gone from the wild, the Arabian oryx came back thanks to conservation.",
p:["The Arabian oryx is a white antelope with long, straight horns. It is perfectly suited to the desert. Its white coat reflects sunlight, and it can sense rain from far away and walk long distances to find fresh plants.",
"By 1972, hunting had wiped out every wild Arabian oryx. The species was extinct in the wild. Luckily, a few oryx still lived in zoos and private herds.",
"Scientists and countries in the region, including the UAE, began breeding them and returning them to protected areas in the desert. The plan worked. In 2011, the Arabian oryx became the first animal to go from ‘extinct in the wild’ back to the safer category of ‘vulnerable’."],
q:[["Cause & effect","Why did the wild Arabian oryx disappear by 1972?",["Because of hunting","Because of floods","Because of disease from camels","Because it moved to Africa"],1],
["Vocabulary","What does ‘extinct in the wild’ mean?",["No animals of the species are left living in nature","The animal is very angry","The animal lives only in water","The animal is very large"],1],
["Detail","What happened to the Arabian oryx in 2011?",["It moved from ‘extinct in the wild’ to ‘vulnerable’","It disappeared again","It was found on another continent","It became a pet"],2]]},

{id:"a3",tp:"animals",e:"🐙",t:"The Octopus: An Alien of the Sea",s:"Three hearts, blue blood and colour-changing skin make the octopus amazing.",
p:["The octopus is one of the strangest animals on Earth. It has eight arms, three hearts and blue blood. Two hearts pump blood through the gills, and the third pumps it around the rest of the body.",
"An octopus can change the colour and texture of its skin in less than a second. It uses this skill to hide from predators, animals that hunt other animals, by blending in with rocks and coral.",
"Octopuses are also very clever. They can solve puzzles, open jars and escape from tanks. If attacked, an octopus can squirt a cloud of ink and swim away while the predator is confused."],
q:[["Detail","How many hearts does an octopus have?",["Three","One","Eight","Two"],0],
["Cause & effect","Why does an octopus change its skin colour?",["To hide from predators","To look pretty","To get warm","To talk to fish"],1],
["Vocabulary","What is a predator?",["An animal that hunts other animals","A type of plant","A baby octopus","A rock on the seabed"],1]]},

{id:"a4",tp:"animals",e:"🐝",t:"The Secret Dance of Bees",s:"Honeybees dance to tell each other where to find flowers.",
p:["Honeybees live together in large groups called colonies. Worker bees fly out to find flowers full of nectar and pollen, which the colony needs for food.",
"When a bee finds good flowers, it returns to the hive and does a special dance called the waggle dance. The direction of the dance shows which way to fly compared to the Sun, and the length of the waggle shows how far away the flowers are.",
"A scientist named Karl von Frisch discovered the meaning of the waggle dance. He won a Nobel Prize for his work in 1973. Bees are also very important for people, because as they move from flower to flower, they pollinate many of the fruits and vegetables we eat."],
q:[["Main idea","What is the waggle dance for?",["Telling other bees where to find flowers","Scaring away birds","Keeping the hive warm","Choosing a new queen"],1],
["Detail","What does the length of the waggle show?",["How far away the flowers are","What colour the flowers are","How many bees should go","The time of day"],1],
["Cause & effect","Why are bees important to people?",["They pollinate many fruits and vegetables we eat","They make electricity","They clean the air","They eat harmful insects"],2]]},

{id:"a5",tp:"animals",e:"🐬",t:"Dolphins See With Sound",s:"Dolphins use echoes to find food and talk with whistles.",
p:["Dolphins are mammals, not fish. They breathe air through a blowhole on top of their head, and mothers feed their babies with milk.",
"Dolphins have an amazing sense called echolocation. They make clicking sounds that travel through the water. When the sound hits a fish or a rock, an echo bounces back. By listening to the echoes, a dolphin can tell the size, shape and distance of objects, even in dark or cloudy water.",
"Dolphins are also very social. They live in groups called pods and communicate with clicks and whistles. Scientists believe each dolphin has its own special whistle, a bit like a name."],
q:[["Detail","How do dolphins breathe?",["Through a blowhole on top of their head","Through gills","Through their skin","They do not breathe"],0],
["Vocabulary","What is echolocation?",["Finding objects by listening to echoes","Swimming very fast","Jumping out of the water","Sleeping in groups"],1],
["Detail","What do scientists believe each dolphin’s special whistle is like?",["A name","A song for rain","A warning about sharks","A type of food"],2]]},

{id:"a6",tp:"animals",e:"🐦",t:"The Longest Journey: Bird Migration",s:"Many birds fly thousands of kilometres each year. The Arctic tern flies the farthest.",
p:["Every year, billions of birds travel long distances between the places where they breed and the places where they spend the winter. This journey is called migration. The UAE is an important resting stop for many migrating birds travelling between Asia and Africa.",
"The champion of migration is the Arctic tern. It flies from the Arctic all the way to Antarctica and back again every year. Over its lifetime, it may fly a distance equal to going to the Moon and back several times.",
"How do birds find their way? Scientists think they use the position of the Sun and stars, landmarks such as coasts and mountains, and even Earth’s magnetic field."],
q:[["Vocabulary","What is migration?",["A long seasonal journey between places","Building a nest","Changing feather colour","Sleeping through winter"],0],
["Detail","Which bird is the champion of migration?",["The Arctic tern","The falcon","The ostrich","The penguin"],1],
["Detail","What might birds use to find their way?",["The Sun, stars, landmarks and Earth’s magnetic field","Maps and phones","Only smell","They follow airplanes"],2]]},

{id:"a7",tp:"animals",e:"🦖",t:"What Happened to the Dinosaurs?",s:"An asteroid hit Earth 66 million years ago, but dinosaurs still live on as birds.",
p:["Dinosaurs ruled Earth for more than 150 million years. Then, about 66 million years ago, most of them suddenly disappeared.",
"Scientists believe a giant asteroid, about 10 kilometres wide, crashed into Earth near what is now Mexico. It left a huge crater called Chicxulub. The crash threw dust and smoke into the sky, blocking sunlight. Plants died, then the animals that ate plants died, and then the meat-eaters starved.",
"But not all dinosaurs vanished. Scientists now agree that birds are the living relatives of dinosaurs. So the next time you see a pigeon or a falcon, you are looking at a dinosaur’s descendant!"],
q:[["Cause & effect","What do scientists believe ended the age of dinosaurs?",["A giant asteroid crashing into Earth","An ice cream shortage","A war between dinosaurs","Too much rain"],1],
["Sequence","What happened right after sunlight was blocked?",["Plants died","Meat-eaters starved first","The asteroid hit","Birds appeared"],1],
["Detail","Which animals alive today are related to dinosaurs?",["Birds","Cats","Fish","Spiders"],2]]},

{id:"a8",tp:"animals",e:"🐢",t:"Sea Turtles Come Home",s:"Sea turtles return to the beach where they hatched to lay their eggs.",
p:["Sea turtles have swum in the oceans for more than 100 million years. Several kinds visit the coasts of the UAE, including green turtles and hawksbill turtles.",
"Female sea turtles do something amazing. After many years at sea, they return to the same beach where they hatched to lay their eggs. They dig a hole in the sand at night, lay around 100 eggs, cover them and return to the sea.",
"The temperature of the sand decides whether the babies will be male or female. Warmer sand produces more females, and cooler sand produces more males. Scientists worry that a warming climate could mean too few male turtles in the future."],
q:[["Detail","Where do female sea turtles lay their eggs?",["On the same beach where they hatched","In the deep ocean","On rocks in rivers","In trees"],1],
["Cause & effect","What decides whether baby turtles are male or female?",["The temperature of the sand","The size of the mother","The colour of the eggs","The time of day"],2],
["Inference","Why might a warming climate be a problem for turtles?",["Warmer sand could mean too few males","Turtles cannot swim in warm water","Eggs would freeze","Beaches would grow"],2]]},

{id:"a9",tp:"animals",e:"🦅",t:"The Falcon: Fastest Animal on Earth",s:"Peregrine falcons dive at over 300 km/h, and falconry is a proud UAE tradition.",
p:["The peregrine falcon is the fastest animal on Earth. When it dives to catch its prey in the air, it can reach speeds of more than 300 kilometres per hour, faster than a racing car.",
"Its body is built for speed. When it dives, it tucks its wings close to its body to reduce air resistance. Special bumps in its nostrils help it breathe even at very high speeds.",
"In the UAE, falconry, the art of training falcons to hunt, has been part of Bedouin life for centuries. In 2010, UNESCO recognised falconry as part of the world’s cultural heritage. Today Abu Dhabi even has a special hospital just for falcons."],
q:[["Detail","How fast can a peregrine falcon dive?",["More than 300 kilometres per hour","About 30 kilometres per hour","About 3 kilometres per hour","As fast as light"],0],
["Cause & effect","Why does a falcon tuck in its wings when diving?",["To reduce air resistance","To keep warm","To hide from people","To slow down"],1],
["Vocabulary","What is falconry?",["The art of training falcons to hunt","A falcon’s nest","A type of falcon food","A falcon race in the sky"],2]]},

{id:"a10",tp:"animals",e:"🐜",t:"Ants: Tiny Farmers",s:"Leafcutter ants grow their own food in underground gardens.",
p:["Ants are small, but they are powerful when they work together. An ant colony can contain millions of ants, and each one has a job. Some find food, some look after the young, and some guard the nest.",
"Leafcutter ants, which live in Central and South America, are farmers. They cut pieces of leaves and carry them back to their nest. But they do not eat the leaves!",
"Instead, they chew the leaves and use them to grow a fungus in underground gardens. The fungus is their food. Ants were farming like this for millions of years before humans planted their first crops."],
q:[["Detail","What do leafcutter ants do with the leaves?",["Use them to grow a fungus to eat","Eat them right away","Build houses with them","Throw them away"],2],
["Main idea","Why are leafcutter ants called farmers?",["They grow their own food in gardens","They raise cows","They plant trees","They work in fields with people"],2],
["Detail","What jobs can ants in a colony have?",["Finding food, caring for young and guarding the nest","Only sleeping","Only fighting","Only digging"],0]]},

/* ===================== PLANTS ===================== */
{id:"p1",tp:"plants",e:"🌿",t:"Photosynthesis: Making Food From Light",s:"Plants use sunlight, water and air to make their own food and give us oxygen.",
p:["Animals have to eat to get energy, but plants make their own food. They do it through a process called photosynthesis, which means ‘putting together with light’.",
"A plant takes in water through its roots and a gas called carbon dioxide from the air through tiny holes in its leaves. A green substance in the leaves called chlorophyll captures energy from sunlight. The plant uses this energy to turn water and carbon dioxide into sugar, its food.",
"Photosynthesis also makes oxygen, which the plant releases into the air. Almost all the oxygen we breathe comes from plants and tiny ocean organisms that photosynthesise."],
q:[["Vocabulary","What does photosynthesis mean?",["Putting together with light","Growing roots","Drinking water","Breathing out"],0],
["Detail","What captures energy from sunlight in leaves?",["Chlorophyll","Roots","Flowers","Sugar"],1],
["Detail","Which gas do plants release during photosynthesis?",["Oxygen","Carbon dioxide","Helium","Smoke"],2]]},

{id:"p2",tp:"plants",e:"🌴",t:"The Date Palm: Tree of Life",s:"For thousands of years, date palms gave food, shade and building materials in Arabia.",
p:["The date palm has been called the ‘tree of life’ in Arabia. For thousands of years, people here have eaten its sweet fruit and used every part of the tree.",
"Palm leaves were woven into mats, baskets and roofs. The trunks became beams for houses, and the fibres were twisted into ropes. Traditional houses called arish were built from palm fronds, which let the breeze pass through.",
"Date palms are either male or female, and only female trees produce dates. To get a good harvest, farmers climb the trees and pollinate the flowers by hand, carrying pollen from male flowers to female ones."],
q:[["Detail","What were palm leaves used for?",["Weaving mats, baskets and roofs","Making glass","Making fuel for cars","Nothing"],1],
["Detail","Which date palms produce dates?",["Only female trees","Only male trees","Both","Neither"],2],
["Inference","Why do farmers pollinate the flowers by hand?",["To get a good harvest of dates","To make the tree taller","To keep birds away","To change the colour of dates"],2]]},

{id:"p3",tp:"plants",e:"🌳",t:"Mangroves: Forests in Salt Water",s:"Mangrove trees grow in salty water, protect coasts and store carbon.",
p:["Most trees would die if their roots were in salt water, but mangroves grow happily along salty coasts. You can find mangrove forests in Abu Dhabi, Umm Al Quwain and other parts of the UAE.",
"Mangroves have special ways to survive. Some remove salt through their roots, and others push salt out through their leaves. Because mud has little oxygen, many mangroves grow pencil-shaped roots that stick up out of the mud to breathe.",
"Mangroves are very useful. Their tangled roots protect the coast from waves and storms, and they are nurseries where baby fish shelter. Mangroves also store large amounts of carbon, which helps fight climate change."],
q:[["Main idea","What makes mangroves special?",["They can grow in salty water","They grow only in deserts","They have no roots","They grow in snow"],0],
["Cause & effect","Why do some mangrove roots stick up out of the mud?",["To breathe, because mud has little oxygen","To catch fish","To scare birds","To collect rain"],1],
["Detail","How do mangroves help baby fish?",["They give them shelter, like a nursery","They feed them salt","They keep them out of the water","They make the water hotter"],2]]},

{id:"p4",tp:"plants",e:"🌼",t:"How Seeds Travel",s:"Plants cannot walk, so their seeds travel by wind, water and animals.",
p:["Plants cannot walk, but their seeds need to move away from the parent plant to find space and light. So plants have developed clever ways to send seeds travelling.",
"Some seeds fly. A dandelion seed has a tiny parachute of fluffy hairs that the wind can carry for kilometres. Some seeds float. Coconuts can drift across oceans and grow on faraway beaches.",
"Other seeds hitch a ride on animals. Some have tiny hooks that stick to fur. Others are hidden inside tasty fruit. Animals eat the fruit, walk away, and later drop the seeds in their droppings, often with a little fertiliser."],
q:[["Cause & effect","Why do seeds need to move away from the parent plant?",["To find space and light","To get away from animals","To find salt","Because the parent plant pushes them"],0],
["Detail","How does a dandelion seed travel?",["The wind carries its fluffy parachute","It floats in the ocean","It sticks to fur","It rolls downhill"],1],
["Detail","How can coconuts reach faraway beaches?",["By drifting across oceans","By flying","By being carried by ants","By rolling"],1]]},

{id:"p5",tp:"plants",e:"🦜",t:"Rainforests: The Planet’s Treasure Chest",s:"Tropical rainforests are home to a huge variety of plants and animals.",
p:["Tropical rainforests grow near the equator, where it is hot and rains almost every day. The largest is the Amazon rainforest in South America.",
"Rainforests are home to an enormous variety of living things. A single tree can hold hundreds of kinds of insects. Many plants found in rainforests have been used to make important medicines.",
"Rainforests have layers, like a building. The tallest trees poke out at the top. Below them is the canopy, a thick roof of leaves where most animals live. The forest floor is dark, because only a little sunlight gets through the leaves above."],
q:[["Detail","Where do tropical rainforests grow?",["Near the equator","Near the North Pole","On high mountains of ice","In dry deserts"],0],
["Vocabulary","What is the canopy?",["A thick roof of leaves where most animals live","The forest floor","A river in the forest","The roots of trees"],2],
["Cause & effect","Why is the forest floor dark?",["Only a little sunlight gets through the leaves above","It is always night there","The soil is black","Animals block the light"],2]]},

{id:"p6",tp:"plants",e:"🍄",t:"Fungi: Not Plants, Not Animals",s:"Mushrooms belong to their own kingdom and connect forests underground.",
p:["Mushrooms might look like plants, but they are not. They belong to a separate group of living things called fungi. Unlike plants, fungi cannot make their own food from sunlight.",

/* ===================== SCIENCE IN THE UAE (how it's used) ===================== */
{id:"u12",tp:"uae",e:"🚰",t:"Turning Sea Water Into Drinking Water",s:"Most of the UAE’s drinking water comes from the sea, thanks to desalination.",
p:["The UAE has very little rain and almost no rivers. So where does the water in your tap come from? Most of the country’s drinking water comes from the sea, after the salt has been removed. This process is called desalination.",
"There are two main ways to do it. In the older way, sea water is heated until it evaporates, and the steam is cooled to make fresh water, leaving the salt behind. In the newer way, called reverse osmosis, sea water is pushed at high pressure through very fine filters called membranes. Water passes through, but the salt does not.",
"Desalination uses a lot of energy, so the UAE is building plants that use less power and can run on solar energy. Scientists are also studying the very salty water left over, called brine, so that it does less harm when it goes back into the sea."],
q:[["Vocabulary","What is desalination?",["Removing salt from sea water to make fresh water","Adding salt to water","Collecting rain water","Cleaning rivers"],0],
["Compare","How does reverse osmosis remove salt?",["It pushes sea water through very fine filters","It boils the water","It freezes the water","It adds chemicals that eat salt"],1],
["Detail","What is brine?",["The very salty water left over","Fresh drinking water","A type of membrane","Steam from heated water"],2]]},

{id:"u13",tp:"uae",e:"🏙️",t:"Masdar City: Designed for the Heat",s:"A neighbourhood in Abu Dhabi uses old and new ideas to stay cool with less energy.",
p:["Masdar City is a neighbourhood in Abu Dhabi that was planned to show how a city in a hot desert can use less energy and water. It is also home to a university that studies clean energy and artificial intelligence.",
"Its designers borrowed ideas from old Arabian towns. The streets are narrow and close together, so buildings shade each other and the people walking below. A modern wind tower in the main square catches breezes and pulls them down, just like the barjeel towers on old houses. Many buildings have patterned screens that block strong sunlight but let in light and air.",
"Masdar City also uses new technology. Solar panels on roofs and in a nearby solar park make electricity, and sensors help buildings save water and power. Scientists measure how well each idea works so other cities can learn from it."],
q:[["Main idea","Why was Masdar City planned?",["To show how a desert city can use less energy and water","To build the tallest tower in the world","To make a theme park","To grow more dates"],0],
["Cause & effect","Why are the streets narrow and close together?",["So buildings shade each other and the people below","So cars can drive faster","Because there was no more land","To keep out camels"],1],
["Compare","What old idea does the modern wind tower copy?",["The barjeel towers on old houses","The falaj water channels","Pearl diving boats","The date palm"],1]]},

{id:"u14",tp:"uae",e:"❄️",t:"Cooling a City With Cold Water",s:"Instead of an air conditioner in every building, Dubai pipes cold water to whole districts.",
p:["Cooling buildings uses a huge amount of electricity in the UAE, especially in summer when temperatures can rise above 45 degrees Celsius.",
"One smart solution is district cooling. Instead of every building having its own air conditioning machines, one big central plant chills water. The cold water travels through insulated underground pipes to many buildings. Inside, the cold water takes heat out of the air, and the warmed water flows back to the plant to be chilled again. This can use much less electricity than many separate machines.",
"Dubai has some of the largest district cooling networks in the world, and the Burj Khalifa is cooled this way. Its cooling system even collects the water that drips from the cold pipes, called condensation, and uses it to water plants around the tower."],
q:[["Sequence","What happens to the water after it takes heat out of a building’s air?",["It flows back to the plant to be chilled again","It is thrown away","It turns into ice","It is used for drinking"],1],
["Main idea","Why is district cooling useful?",["It can use much less electricity than many separate machines","It makes buildings warmer","It needs no water","It makes the city quieter at night"],1],
["Detail","What does the Burj Khalifa do with its condensation water?",["Uses it to water plants","Pours it into the sea","Sells it as drinking water","Uses it to wash cars"],2]]},

{id:"u15",tp:"uae",e:"🚇",t:"The Train With No Driver",s:"The Dubai Metro runs on computers instead of drivers.",
p:["On 9 September 2009, the Dubai Metro opened. It was the first city metro in the Arabian Gulf region, and its trains have no drivers at all.",
"Instead of a person, a computer system controls each train. It decides when the train speeds up, slows down and stops, and keeps trains at a safe distance from each other. Glass doors along the platforms open only when a train has stopped in the right place, which keeps passengers safe.",
"Driverless trains can run close together and stick to the timetable very accurately. Engineers in a control centre watch the whole network on screens and can step in if anything goes wrong. The stations were also designed with special cooling, because waiting outside in the summer heat would be very uncomfortable."],
q:[["Detail","What controls each Dubai Metro train?",["A computer system","A driver in the front","A remote-control car","The passengers"],1],
["Cause & effect","Why do the platform doors open only when a train has stopped in the right place?",["To keep passengers safe","To save electricity","To keep birds out","To make the train go faster"],1],
["Detail","Who watches the whole network?",["Engineers in a control centre","Police on every train","Nobody","The passengers"],2]]},

/* ===================== SCIENCE AROUND THE WORLD ===================== */
{id:"w1",tp:"world",e:"🌷",t:"The Netherlands: Holding Back the Sea",s:"A country that is partly below sea level uses engineering to stay dry.",
p:["About a quarter of the Netherlands lies below sea level. Without protection, the sea and rivers would flood a large part of the country. For hundreds of years, the Dutch have used science and engineering to keep their land dry.",
"Long ago, they built walls of earth called dikes along the coast and rivers. Windmills powered pumps that moved water out of low fields and into canals. Land that was taken from the water like this is called a polder.",
"In 1953, a terrible storm flood killed more than 1,800 people. After that, the country built the Delta Works, a huge system of dams and storm barriers. Some barriers stay open so ships can pass, but they close when a dangerous storm is coming. Engineers from many countries now visit to learn from the Dutch."],
q:[["Detail","How much of the Netherlands lies below sea level?",["About a quarter","All of it","None of it","About half of a city"],0],
["Vocabulary","What is a polder?",["Land taken from the water and kept dry","A type of windmill","A storm barrier","A Dutch boat"],1],
["Cause & effect","Why was the Delta Works built?",["Because a terrible storm flood in 1953 killed many people","To make electricity","To grow tulips","To stop earthquakes"],2]]},

{id:"w2",tp:"world",e:"🗼",t:"Japan: Buildings That Dance in Earthquakes",s:"Japanese engineers design buildings that move safely when the ground shakes.",
p:["Japan has more earthquakes than almost any other country, so its engineers have become experts at keeping buildings standing.",
"One idea is base isolation. The building sits on special rubber and steel pads instead of directly on the ground. When the ground shakes, the pads absorb much of the movement, so the building above moves more gently. Other buildings have dampers, which work like giant shock absorbers in a car.",
"Some ideas are very old. Wooden pagodas, tall towers at temples, have survived earthquakes for over a thousand years, partly thanks to a central pillar that helps them sway safely. The Tokyo Skytree, one of the tallest towers in the world, has a concrete column in its centre that was inspired by these pagodas."],
q:[["Vocabulary","What is base isolation?",["Putting a building on pads that absorb the ground’s movement","Building only one floor","Using very heavy roofs","Building underground"],1],
["Figurative language","What does the author compare dampers to?",["Giant shock absorbers in a car","Springs in a bed","Wheels on a bike","Pillows"],1],
["Detail","What inspired the central column of the Tokyo Skytree?",["Old wooden pagodas","Bamboo trees","Japanese bullet trains","Volcanoes"],2]]},

{id:"w3",tp:"world",e:"♨️",t:"Iceland: Heat From Under the Ground",s:"Iceland heats almost all its homes with hot water from inside the Earth.",
p:["Iceland is an island in the North Atlantic Ocean, sitting right on top of the place where two tectonic plates are pulling apart. Because of this, hot rock lies close to the surface, and there are volcanoes, hot springs and geysers.",
"Icelanders use this heat. Hot water and steam from deep underground are piped to power plants and homes. This is called geothermal energy, from Greek words meaning ‘earth heat’. About nine out of ten homes in Iceland are heated this way.",
"Almost all of Iceland’s electricity comes from renewable sources: geothermal energy and hydropower from rivers. The warm water is even used to heat greenhouses, so Icelanders can grow tomatoes and bananas near the Arctic Circle, and to melt snow on some pavements in winter."],
q:[["Cause & effect","Why is there hot rock close to the surface in Iceland?",["It sits where two tectonic plates are pulling apart","It is close to the Sun","People heat the ground","It has a desert climate"],0],
["Vocabulary","What does ‘geothermal’ mean?",["Earth heat","Water power","Wind energy","Cold ground"],1],
["Detail","What is one use of warm water in Iceland besides heating homes?",["Heating greenhouses to grow fruit and vegetables","Making ice cream","Filling swimming pools only in summer","Cooling computers"],2]]},

{id:"w4",tp:"world",e:"💧",t:"Singapore: Water From Used Water",s:"A small country with little land cleans used water so well that it can be drunk.",
p:["Singapore is a small island country with a lot of rain but not much land to store it. For many years it bought much of its water from its neighbour, Malaysia. So scientists looked for new ways to make sure the country would never run out.",
"In 2003, Singapore introduced NEWater. Used water from homes and factories is first cleaned at treatment plants. Then it passes through very fine membranes that remove tiny particles and germs, and finally it is treated with ultraviolet light to kill anything left. The result is ultra-clean water.",
"Most NEWater is used by factories that need very pure water, such as computer chip makers. Some is added to reservoirs, where it mixes with rain water before being treated again for drinking. Singapore says NEWater can meet up to 40 percent of its water needs."],
q:[["Cause & effect","Why did Singapore look for new water sources?",["It has little land to store water and bought water from a neighbour","It has no rain at all","Its rivers are too salty","It wanted to sell water"],0],
["Sequence","What is the last step in making NEWater?",["Treating it with ultraviolet light","Cleaning it at a treatment plant","Passing it through membranes","Adding it to the sea"],1],
["Detail","Who uses most NEWater?",["Factories that need very pure water","Swimming pools","Farmers","Ships"],2]]},

{id:"w5",tp:"world",e:"📡",t:"China: The Giant Ear Listening to Space",s:"China built the world’s largest single-dish radio telescope in a natural valley.",
p:["In a mountain valley in Guizhou province, China, there is a giant dish 500 metres wide. It is called FAST, and it is the largest single-dish radio telescope in the world. Its dish is big enough to hold about 30 football pitches.",
"A radio telescope does not take pictures with light. It collects faint radio waves that come from stars, galaxies and other objects in space. The dish is made of thousands of panels, and its shape can be adjusted slightly to focus on different parts of the sky.",
"Engineers chose a natural bowl-shaped valley, so they did not need to dig a huge hole. Since it started working in 2016, FAST has discovered hundreds of pulsars, which are spinning dead stars that send out regular pulses of radio waves, like lighthouses in space."],
q:[["Detail","How wide is the FAST dish?",["500 metres","5 metres","50 kilometres","50 metres"],0],
["Compare","How is a radio telescope different from a normal telescope?",["It collects radio waves instead of light","It only works in daytime","It looks at the ocean","It uses no dish"],1],
["Figurative language","Why does the author compare pulsars to lighthouses?",["They send out regular pulses, like flashes from a lighthouse","They are near the sea","They are tall buildings","They guide ships"],2]]},

{id:"w6",tp:"world",e:"🌕",t:"India: Landing Near the Moon’s South Pole",s:"In 2023, India became the first country to land near the Moon’s south pole.",
p:["On 23 August 2023, India’s spacecraft Chandrayaan-3 landed on the Moon. ‘Chandrayaan’ means ‘Moon vehicle’ in Sanskrit. India became the first country ever to land near the Moon’s south pole.",
"Scientists are very interested in this area because some craters there are always in shadow. They may hold frozen water. Water on the Moon could one day give astronauts drinking water, and it could even be split into hydrogen and oxygen to make rocket fuel.",
"The lander, called Vikram, carried a small rover called Pragyan. The rover drove across the surface and studied the soil, confirming that it contains sulphur. India’s earlier mission, Chandrayaan-2, had crashed during landing in 2019, so the engineers studied what went wrong and made the new lander stronger."],
q:[["Detail","What did India become the first country to do?",["Land near the Moon’s south pole","Land on Mars","Send a person to the Moon","Build a space station"],0],
["Cause & effect","Why are scientists interested in the Moon’s south pole?",["Shadowy craters there may hold frozen water","It is the warmest place on the Moon","It has trees","It is closest to Earth"],1],
["Compare","How did Chandrayaan-3 learn from Chandrayaan-2?",["Engineers studied the crash and made the new lander stronger","They used the same lander again","They landed somewhere else","They did not change anything"],2]]},

{id:"w7",tp:"world",e:"📱",t:"Kenya: Sending Money by Text Message",s:"A simple phone service changed how millions of people in Kenya use money.",
p:["In 2007, a mobile phone company in Kenya launched a service called M-Pesa. ‘Pesa’ means ‘money’ in Swahili. At that time, many people in Kenya did not have a bank account, and banks were often far away.",
"With M-Pesa, people can store money on their mobile phone account and send it to someone else using a simple text message. They do not need a smartphone or the internet. To put cash in or take it out, they visit a local shop that works as an M-Pesa agent.",
"The idea spread quickly. Workers in cities could send money to their families in villages in seconds, instead of carrying cash on long journeys. Today, many countries have copied the idea, and scientists study how it has helped people save money and start small businesses."],
q:[["Vocabulary","What does ‘pesa’ mean in Swahili?",["Money","Phone","Bank","Message"],0],
["Detail","What do people need to use M-Pesa?",["A simple mobile phone","A smartphone and internet","A bank account","A computer"],1],
["Cause & effect","How did M-Pesa help city workers?",["They could send money to their families in seconds","They got free phones","They did not have to work","They could fly home for free"],2]]},

{id:"w8",tp:"world",e:"🏞️",t:"Egypt: Taming the River Nile",s:"The Aswan High Dam controls the Nile’s floods and makes electricity.",
p:["For thousands of years, life in Egypt depended on the River Nile. Every summer the river flooded, spreading rich mud over the fields. But some years the flood was too big and destroyed villages, and some years it was too small and crops failed.",
"In 1970, Egypt finished the Aswan High Dam. It holds back an enormous reservoir called Lake Nasser, one of the largest artificial lakes in the world. Engineers can now release water steadily all year, so farmers can grow crops more than once a year, and the dam makes electricity too.",
"Building the dam also created problems. The rising water would have drowned ancient temples at Abu Simbel. So in the 1960s, engineers from many countries cut the temples into huge blocks and rebuilt them on higher ground. Also, the rich mud now stays behind the dam, so farmers use more fertiliser."],
q:[["Detail","What problem did the Nile’s floods sometimes cause?",["Floods that were too big or too small","The water was too salty","The river froze","The river disappeared"],0],
["Detail","What is Lake Nasser?",["The reservoir held back by the dam","A natural lake in the desert","A part of the sea","A lake in the city of Cairo"],1],
["Cause & effect","Why do farmers now use more fertiliser?",["The rich mud stays behind the dam","The soil is too wet","The temples were moved","There is too much rain"],2]]},

{id:"w9",tp:"world",e:"🔌",t:"Norway: The Country of Electric Cars",s:"In Norway, around nine out of ten new cars sold are fully electric.",
p:["Norway is one of the world’s biggest producers of oil and gas, yet it has become the world leader in electric cars. In 2024, around nine out of ten new cars sold in Norway were fully electric.",
"How did this happen? For many years, the government made electric cars cheaper by removing taxes on them, while petrol cars had high taxes. Electric car drivers also got other benefits, such as cheaper parking and tolls. The country built thousands of charging stations, even in remote places.",
"Electric cars make the most sense when the electricity is clean, and Norway is lucky. Its mountains and rivers allow it to make most of its electricity from hydropower. Scientists around the world study Norway to see how quickly a country can switch to cleaner transport."],
q:[["Detail","About how many new cars sold in Norway in 2024 were fully electric?",["Around nine out of ten","One out of ten","Half","None"],0],
["Cause & effect","How did the government make electric cars more popular?",["It removed taxes on them and gave other benefits","It banned all cars","It gave free petrol","It closed the roads"],1],
["Detail","Where does Norway get most of its electricity?",["Hydropower","Coal","Oil","Nuclear power"],2]]},

{id:"w10",tp:"world",e:"🔆",t:"Morocco: Sunshine After Sunset",s:"A giant solar plant in the Sahara keeps making electricity at night.",
p:["Near the city of Ouarzazate, on the edge of the Sahara Desert, Morocco has built one of the largest solar power complexes in the world. It is called Noor, which means ‘light’ in Arabic.",
"Part of Noor uses solar panels, but much of it uses concentrated solar power. Thousands of curved mirrors, or a field of mirrors around a tall tower, focus sunlight onto a liquid and heat it to very high temperatures. The heat boils water into steam, which spins turbines to make electricity.",
"The clever part is storage. Some of the heat is stored in huge tanks of melted salt, which stays hot for many hours. After sunset, the hot salt is used to keep making steam, so the plant can supply electricity at night, when people turn on their lights."],
q:[["Vocabulary","What does ‘Noor’ mean in Arabic?",["Light","Sun","Desert","Power"],0],
["Sequence","What happens after the mirrors heat the liquid?",["The heat boils water into steam that spins turbines","The liquid is sold","The mirrors melt","Panels turn it into salt"],1],
["Cause & effect","How can the plant make electricity after sunset?",["It uses heat stored in tanks of melted salt","It uses moonlight","It burns oil at night","It turns the mirrors around"],2]]},

{id:"w11",tp:"world",e:"🐧",t:"Antarctica: A Continent for Science",s:"Countries have agreed to use Antarctica only for peace and science.",
p:["Antarctica is the coldest, windiest and driest continent on Earth. No country owns it. In 1959, twelve countries signed the Antarctic Treaty, agreeing that Antarctica should be used only for peaceful purposes and scientific research. Many more countries have joined since then.",
"Today, scientists from around the world live and work at research stations there. Some drill deep into the ice and pull out long tubes called ice cores. Tiny bubbles of air trapped in the ice show what Earth’s atmosphere was like hundreds of thousands of years ago.",
"Antarctica also helped discover a danger to the whole planet. In 1985, British scientists working there reported the hole in the ozone layer. That discovery led countries to ban the harmful chemicals that caused it."],
q:[["Detail","What did the Antarctic Treaty agree?",["Antarctica should be used only for peace and science","One country owns Antarctica","Antarctica should be used for mining","Tourists cannot visit"],0],
["Vocabulary","What is an ice core?",["A long tube of ice drilled from deep in the ice","A type of penguin","A frozen lake","A research station"],1],
["Detail","What did British scientists in Antarctica report in 1985?",["The hole in the ozone layer","A new kind of penguin","A volcano under the ice","Oil under the ice"],2]]},

p:["On the border between Switzerland and France, deep underground, is a ring-shaped tunnel 27 kilometres long. Inside it is the Large Hadron Collider, the biggest and most powerful particle accelerator in the world. It belongs to CERN, a laboratory supported by many countries.",
"In the collider, tiny particles called protons are sped up to almost the speed of light and smashed into each other. Giant detectors record what happens in these collisions, like cameras taking millions of pictures every second. Scientists study the results to learn what everything in the universe is made of.",
"In 2012, scientists at CERN announced the discovery of the Higgs boson, a particle that helps explain why other particles have mass. Thousands of scientists from over 100 countries worked on it. CERN is also where the World Wide Web was invented."],

{id:"w13",tp:"world",e:"🌾",t:"Brazil: Cars That Run on Sugarcane",s:"Brazil makes fuel from sugarcane, and most of its new cars can use it.",
p:["Brazil is the world’s largest grower of sugarcane, a tall grass full of sweet juice. Since the 1970s, Brazil has turned a lot of that sugarcane into a fuel called ethanol.",
"To make ethanol, the juice from sugarcane is mixed with yeast. The yeast eats the sugar and produces alcohol, a process called fermentation. The alcohol is then purified so it can be burned in car engines. The leftover stalks are burned to make electricity for the factories.",
"Since 2003, most new cars sold in Brazil have been ‘flex-fuel’ cars, which can run on petrol, ethanol or any mix of the two. Because sugarcane takes in carbon dioxide as it grows, ethanol can produce less pollution overall than petrol. But growing so much sugarcane needs a lot of land, and scientists study how to protect forests at the same time."],
q:[["Vocabulary","What is fermentation?",["Yeast eating sugar and producing alcohol","Burning sugarcane","Cutting grass","Cooling fuel"],1],
["Detail","What can a ‘flex-fuel’ car run on?",["Petrol, ethanol or any mix of the two","Only electricity","Only sugar","Water"],2],
["Detail","What is one problem with growing so much sugarcane?",["It needs a lot of land","It makes cars slower","It is too sweet","It cannot grow in Brazil"],2]]},

{id:"w14",tp:"world",e:"🔭",t:"Chile: Telescopes in the Driest Desert",s:"Chile’s high, dry Atacama Desert is one of the best places on Earth to study the sky.",
p:["The Atacama Desert in northern Chile is one of the driest places on Earth. Some weather stations there have almost never recorded rain. That makes it terrible for farming, but perfect for astronomy.",
"Water vapour in the air blocks some of the light and radio waves coming from space. In the Atacama, the air is extremely dry, and many telescopes are built high in the mountains, where the air is thin. The nights are also very dark, because few cities are nearby.",
"One famous observatory is ALMA, which has 66 antennas on a high plateau about 5,000 metres above sea level. The antennas work together like one giant telescope. Countries from Europe, North America and East Asia worked with Chile to build it, and it helps scientists watch how stars and planets are born."],

function normWord(s){return String(s||"").toLowerCase().replace(/[01345789@$!|€]/g,c=>LEET[c]||c)}
const squash=s=>s.replace(/(.)\1+/g,"$1");
function hasBadWord(text){
 const low=normWord(text);
 const flat=low.replace(/[^a-zа-яё\u0600-\u06ff]/g,"");
 const forms=[flat,squash(flat)];
 if(BAD.s.some(w=>forms.some(f=>f.includes(w)||f.includes(squash(w)))))return true;
 const toks=low.split(/[^a-zа-яё\u0600-\u06ff]+/).filter(Boolean);
 return toks.some(t=>BAD.e.includes(t)||BAD.e.includes(squash(t)));
}
function maskBad(text){
 return String(text).replace(/[^\s]+/g,w=>hasBadWord(w)?"•".repeat(Math.min(w.length,8)):w);

const PH={map:null};const CK="sr_img_"+Object.keys(IMG).length+"_"+Object.values(IMG).flat().length;
function loadPhotos(){
 if(PH.map)return Promise.resolve(PH.map);if(PH.p)return PH.p;
 PH.p=fetch("photos/credits.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).catch(()=>null).then(loc=>{
  const m={};if(loc)for(const [id,v] of Object.entries(loc))m[id]={u:v.file,f:v.source_file,a:v.title,who:v.author,lic:v.license,local:true};
  if(Object.keys(IMG).every(id=>m[id])){PH.map=m;return m}
  PH.p=null;return remotePhotos().then(r=>{PH.map=Object.assign({},r,m);return PH.map}).catch(()=>{PH.map=m;return m});
 });
 return PH.p;
}
function remotePhotos(){
 if(PH.p)return PH.p;
 const c=ls.get(CK,null);if(c&&Date.now()-c.t<7*864e5){PH.map=c.m;return Promise.resolve(PH.map)}
 const titles=[...new Set(Object.values(IMG).flat())];const chunks=[];for(let i=0;i<titles.length;i+=50)chunks.push(titles.slice(i,i+50));
 PH.p=Promise.all(chunks.map(ch=>fetch("https://en.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*&redirects=1&prop=pageimages&piprop=thumbnail|name&pithumbsize=960&pilimit=50&titles="+encodeURIComponent(ch.join("|"))).then(r=>r.json()).catch(()=>null)))
 .then(rs=>{const byT={};
  rs.forEach(r=>{if(!r||!r.query)return;const q=r.query,al={};
   (q.normalized||[]).forEach(x=>al[x.to]=(al[x.to]||[]).concat(x.from));
   (q.redirects||[]).forEach(x=>{al[x.to]=(al[x.to]||[]).concat(x.from,...(al[x.from]||[]))});
   (q.pages||[]).forEach(p=>{if(p.thumbnail&&p.pageimage){const v={u:p.thumbnail.source,f:p.pageimage,a:p.title};byT[p.title]=v;(al[p.title]||[]).forEach(t=>byT[t]=v)}})});
  const m={};for(const [id,list] of Object.entries(IMG))for(const t of list)if(byT[t]){m[id]=byT[t];break}
  PH.map=m;if(Object.keys(m).length)ls.set(CK,{t:Date.now(),m});return m});
 return PH.p;
}
const photo=a=>`<div class="ph" data-img="${a.id}"></div>`;
function fillPhotos(root=document){loadPhotos().then(m=>{root.querySelectorAll(".ph[data-img]:not([data-done])").forEach(el=>{el.dataset.done=1;const v=m[el.dataset.img];if(!v)return;const im=new Image();im.alt="";im.loading="lazy";im.decoding="async";im.src=v.u;im.onload=()=>im.classList.add("shown");el.prepend(im)})})}
function credit(id,el){loadPhotos().then(m=>{const v=m[id];if(!v){el.textContent="";return}
 const file="https://en.wikipedia.org/wiki/File:"+encodeURIComponent(v.f);
 if(v.local){el.innerHTML=`Photo: ${esc(v.who||"unknown author")}${v.lic?", "+esc(v.lic):""}, via <a href="${file}" target="_blank" rel="noopener">Wikimedia</a>`;return}
 el.innerHTML=`Photo from the Wikipedia article “${esc(v.a)}”. <a href="${file}" target="_blank" rel="noopener">Author and licence</a>`;
 fetch("https://en.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*&prop=imageinfo&iiprop=extmetadata&titles="+encodeURIComponent("File:"+v.f)).then(r=>r.json()).then(r=>{
  const md=r.query.pages[0].imageinfo[0].extmetadata;const who=md.Artist?md.Artist.value.replace(/<[^>]*>/g,"").trim():"";const lic=md.LicenseShortName?md.LicenseShortName.value:"";
  if(who||lic)el.innerHTML=`Photo: ${esc(who||"unknown author")}${lic?", "+esc(lic):""}, via <a href="${file}" target="_blank" rel="noopener">Wikimedia</a>`}).catch(()=>{})})}

function basicCheck(t){
 const all=[t.title,t.text,...t.qs.flatMap(q=>[q.q,...q.o])].join(" "),p=[];
 if(BLOCK.test(all))p.push("Links and email addresses aren’t allowed.");
 if(hasBadWord(all))p.push("Your task has a word that isn’t allowed on this website. Please change it.");
 if(/\+?\d[\d\s()-]{7,}\d/.test(all))p.push("Please don’t include phone numbers or other personal details.");
 const letters=all.replace(/[^A-Za-z]/g,"");if(letters.length>30&&letters.replace(/[^A-Z]/g,"").length/letters.length>.6)p.push("Please don’t write everything in capital letters.");
 if(/(.)\1{5,}/.test(all))p.push("Remove long repeated letters or symbols.");
 return p;
}
function answerTips(t){
 const text=t.text.toLowerCase(),tips=[];
 t.qs.forEach((q,i)=>{const w=q.o[q.a].toLowerCase().match(/[a-z]{4,}/g)||[];if(w.length&&!w.some(x=>text.includes(x.slice(0,5))))tips.push(`Check that the answer to question ${i+1} (“${q.o[q.a]}”) can be found in your text.`)});
 return tips;
}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error("load "+src));document.head.appendChild(s)})}
let TOX=null;
async function loadTox(){
 if(TOX)return TOX;
 await loadScript("https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js");
 await loadScript("https://cdn.jsdelivr.net/npm/@tensorflow-models/universal-sentence-encoder@1.3.3/dist/universal-sentence-encoder.min.js");
 await loadScript("https://cdn.jsdelivr.net/npm/@tensorflow-models/toxicity@1.2.2/dist/toxicity.min.js");
 TOX=await Promise.race([window.toxicity.load(0.8),new Promise((_,no)=>setTimeout(()=>no(new Error("timeout")),120000))]);
 return TOX;
}
const TOXNAME={identity_attack:"attacking a group of people",insult:"insults",obscene:"rude words",severe_toxicity:"very unkind language",sexual_explicit:"adult content",threat:"threats",toxicity:"unkind language"};
async function checkTask(t,status){
 const p=basicCheck(t);if(p.length)return {ok:false,problems:p};
 const tips=answerTips(t);
 if(CHECK_URL){
  try{status("The AI checker is reading your task. The first check of the day can take up to a minute…");
   const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),90000);
   const r=await fetch(CHECK_URL,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(t),signal:ctl.signal});clearTimeout(tm);
   if(r.ok){const j=await r.json();if(typeof j.ok==="boolean")return {ok:j.ok,problems:j.problems||[],tips:(j.tips||[]).concat(j.ok?[]:[]),by:"claude"}}
  }catch(e){console.warn("Claude checker unavailable",e)}
 }
 try{
  status("Loading the AI safety checker. The first time can take up to a minute…");
  const m=await loadTox();
  status("The AI checker is reading your task…");
  const parts=[t.title,...t.text.split(/(?<=[.!?])\s+|\n+/),...t.qs.flatMap(q=>[q.q,...q.o])].map(x=>x.trim()).filter(Boolean).slice(0,80);
  const res=await m.classify(parts);
  const bad=res.filter(x=>x.results.some(r=>r.match===true)).map(x=>TOXNAME[x.label]||x.label);
  if(bad.length)return {ok:false,problems:[`The AI checker found something that may not be OK for a school website (${[...new Set(bad)].join(", ")}). Please change those words and try again.`]};
  return {ok:true,tips,by:"ai"};
 }catch(e){
  console.warn("AI checker unavailable",e);
  return {ok:true,tips,by:"rules",note:"The AI checker couldn’t load right now, so only the basic safety check was used. Publishing…"};
 }
}
function makeTask(){
 stopSpeech();navOn("#/community");
 if(USER.guest){location.hash="#/community";return}
 const draft=ls.get("sr_draft",null)||{title:"",tp:"space",text:"",qs:[{q:"",o:["","","",""],a:0}]};
 $("#app").innerHTML=`<div class="w">
  <div class="crumb"><a href="#/community">Community tasks</a></div>
  <div class="pagehead"><div><h1>Make a task</h1><p>Write a short science text and 1 to 3 questions about it. Make sure every answer can be found in your text. Everyone can see what you publish, so don’t include personal information or links.</p></div></div>
  <form class="form" id="tform" novalidate>
   <label class="f" for="tt">Title</label><input class="in" id="tt" maxlength="80" value="${esc(draft.title)}" placeholder="For example: Why the sky is blue">
   <label class="f" for="ttp">Topic</label><select class="in" id="ttp">${Object.entries(TOPICS).map(([k,v])=>`<option value="${k}" ${draft.tp===k?"selected":""}>${v[0]}</option>`).join("")}</select>
   <label class="f">Picture <small>Choose a photo that fits your task</small></label><div class="pick" id="pick"></div>
   <label class="f" for="ttx">Your text <small>40 to 1,500 characters. Leave an empty line between paragraphs.</small></label><textarea class="in" id="ttx" maxlength="1500">${esc(draft.text)}</textarea>
   <div id="qwrap"></div>
   <div class="row" style="margin-top:16px"><button type="button" class="link" id="addq">Add a question</button></div>
   <p class="note" style="margin-top:18px">Before your task is published, an AI checker reads it to make sure it’s kind, safe and suitable for everyone.</p>
   <div id="tcheck" aria-live="polite"></div>
   <p class="err" id="terr" role="alert"></p>
   <div class="row"><button class="btn" id="pub">Check and publish</button><a href="#/community" class="link">Cancel</a></div>
  </form></div>`;
 const D=draft;
 const drawQs=()=>{$("#qwrap").innerHTML=D.qs.map((q,qi)=>`<div class="qedit"><h3>Question ${qi+1}${D.qs.length>1?`<button type="button" class="link danger" data-rmq="${qi}">Remove</button>`:""}</h3>
  <label class="f" for="q${qi}">Question</label><input class="in" id="q${qi}" data-qi="${qi}" data-k="q" maxlength="160" value="${esc(q.q)}">
  <label class="f">Answers <small>Type four answers and tick the correct one</small></label>
  ${q.o.map((o,oi)=>`<div class="optrow"><input type="radio" name="c${qi}" aria-label="Answer ${"ABCD"[oi]} is correct" data-qi="${qi}" data-ok="${oi}" ${q.a===oi?"checked":""}><input class="in" data-qi="${qi}" data-oi="${oi}" maxlength="120" placeholder="Answer ${"ABCD"[oi]}" value="${esc(o)}"></div>`).join("")}</div>`).join("");
  $("#addq").style.display=D.qs.length>=3?"none":"";};
 drawQs();
 const drawPick=()=>{const list=A.filter(a=>a.tp===D.tp);if(!list.some(a=>a.id===D.img))D.img=list[0]&&list[0].id;
  $("#pick").innerHTML=list.map(a=>`<button type="button" data-pic="${a.id}" aria-pressed="${D.img===a.id}">${photo(a)}<span>${a.t}</span></button>`).join("");fillPhotos($("#pick"))};
 drawPick();
 $("#pick").onclick=e=>{const b=e.target.closest("[data-pic]");if(!b)return;D.img=b.dataset.pic;ls.set("sr_draft",D);$("#pick").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b))};
 let ack=false;
 const keep=()=>{if(ack){ack=false;$("#pub").textContent="Check and publish"}ls.set("sr_draft",D)};
 $("#tform").oninput=e=>{const el=e.target;
  if(el.id==="tt")D.title=el.value;else if(el.id==="ttx")D.text=el.value;
  else if(el.dataset.k==="q")D.qs[+el.dataset.qi].q=el.value;else if(el.dataset.oi!==undefined)D.qs[+el.dataset.qi].o[+el.dataset.oi]=el.value;keep()};
 $("#tform").onchange=e=>{const el=e.target;if(el.id==="ttp"){D.tp=el.value;drawPick()}if(el.dataset.ok!==undefined)D.qs[+el.dataset.qi].a=+el.dataset.ok;keep()};
 $("#addq").onclick=()=>{D.qs.push({q:"",o:["","","",""],a:0});keep();drawQs()};
 $("#qwrap").onclick=e=>{const b=e.target.closest("[data-rmq]");if(b){D.qs.splice(+b.dataset.rmq,1);keep();drawQs()}};
 $("#tform").onsubmit=async e=>{
  e.preventDefault();const err=m=>{$("#terr").textContent=m};
  const title=D.title.trim(),text=D.text.trim();
  if(title.length<4)return err("Give your task a title (at least 4 characters).");
  if(text.length<40)return err("Your text is too short. Write at least 40 characters.");
  for(let i=0;i<D.qs.length;i++){const q=D.qs[i];if(q.q.trim().length<5)return err(`Question ${i+1} needs a question.`);if(q.o.some(o=>!o.trim()))return err(`Question ${i+1} needs all four answers.`);if(new Set(q.o.map(o=>o.trim().toLowerCase())).size<4)return err(`Question ${i+1} has two answers that are the same.`)}
  const task={title,tp:D.tp,img:D.img||"",text,qs:D.qs.map(q=>({q:q.q.trim(),o:q.o.map(o=>o.trim()),a:q.a}))};
  err("");$("#pub").disabled=true;
  const box=$("#tcheck"),status=m=>{box.innerHTML=`<p class="check">${esc(m)}</p>`};
  const v=await checkTask(task,status);
  if(!v.ok){$("#pub").disabled=false;box.innerHTML=`<div class="check bad"><b>Your task can’t be published yet.</b><ul>${v.problems.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>${v.tips&&v.tips.length?`<p style="margin:8px 0 0">Tips: ${v.tips.map(esc).join(" ")}</p>`:""}</div>`;return}
  if(v.tips&&v.tips.length&&!ack){ack=true;$("#pub").disabled=false;$("#pub").textContent="Publish anyway";box.innerHTML=`<div class="check"><b>Your task passed the check.</b> A few ideas to make it better before you publish:<ul>${v.tips.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;return}
  status(v.note||"Check passed. Publishing…");task.checked=v.by;
  try{await DB.addTask(task);ls.del("sr_draft");location.hash="#/community";setTimeout(()=>community("Published! Your task is now in the community."),30)}
  catch(x){$("#pub").disabled=false;err("Couldn’t publish right now. Check your internet connection and try again.")}
 };
}
let P=null;
async function playTask(id){
 stopSpeech();navOn("#/community");
 $("#app").innerHTML=`<div class="w"><p class="none">Loading…</p></div>`;
 let t=null;try{t=(await DB.listTasks()).find(x=>x.id===id)}catch(e){}
 if(!t){$("#app").innerHTML=`<div class="w"><div class="crumb"><a href="#/community">Community tasks</a></div><p class="none">This task can’t be found. It may have been deleted.</p></div>`;return}
 P={t,ans:t.qs.map(()=>null),checked:false};
 const paras=t.text.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
 const big=ls.get("sr_big",false);
 $("#app").innerHTML=`<div class="w">
  <div class="crumb"><a href="#/community">Community tasks</a></div>
  <div class="lesson" style="margin-top:14px"><article class="page">
   <span class="topic" ${tcol(t.tp)}>${(TOPICS[t.tp]||["Science"])[0]}</span><h1>${esc(t.title)}</h1>
   <p class="meta" style="display:flex;align-items:center;gap:10px">${avatarSVG(t.byAv||DEFAULT_AV,32,"")}Made by ${esc(t.byName)}${t.checked&&t.checked!=="rules"?` <span class="badge-ai">✓ AI checked</span>`:""}</p>
   ${t.img&&byId(t.img)?`<figure>${photo(byId(t.img))}<figcaption id="cap"></figcaption></figure>`:""}
   ${toolsHTML(big,t.text.split(/\s+/).length)}
   <div class="body plain ${big?"big":""}" id="body">${paras.map(x=>`<p><span class="t">${esc(x).replace(/\n/g,"<br>")}</span></p>`).join("")}</div>
  </article><aside class="side"><div class="panel" id="panel"></div></aside></div></div>`;
 bindTools(t.title+". "+t.text);if(t.img&&byId(t.img)){fillPhotos();credit(t.img,$("#cap"))}
 $("#panel").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.q!==undefined&&!P.checked){P.ans[+b.dataset.q]=+b.dataset.o;ppanel()}
  if(b.id==="psub"){P.checked=true;ppanel()}
  if(b.id==="pretry"){P.checked=false;P.ans=P.ans.map(()=>null);ppanel()}};
 ppanel();window.scrollTo(0,0);
}
function ppanel(){
 const t=P.t,right=P.ans.filter((x,i)=>x===t.qs[i].a).length,n=t.qs.length;
 let h=P.checked?`<div class="result"><div class="big">${right}<small> of ${n}</small></div><p>Community tasks are just for practice, so they don’t give points.</p><div class="row"><button class="btn line" id="pretry">Try again</button><a class="btn" href="#/community">More tasks</a></div></div>`:
  `<h2>Answer the questions</h2><p>This task was made by another reader. It doesn’t give points.</p>`;
 h+=`<div class="qs">${t.qs.map((q,qi)=>qBlock({q:q.q,o:q.o,a:q.a},qi,[0,1,2,3],P)).join("")}</div>`;
 if(!P.checked)h+=`<button class="btn full" id="psub" style="margin-top:18px" ${P.ans.includes(null)?"disabled":""}>Check my answers</button>`;
 $("#panel").innerHTML=h;
}

function route(){
 if(DB.pending)return googleSetup();
 if(!USER)return gate();
 if(!$("#app"))shell();
 $("#app").onclick=null;$("#app").onchange=null;pending=null;stopChat();
 const h=location.hash;let m;
 if((m=h.match(/^#\/read\/(\w+)/)))lesson(m[1]);
 else if(h==="#/avatar")shop();
 else if(h==="#/community/new")makeTask();
 else if((m=h.match(/^#\/community\/play\/([\w-]+)/)))playTask(m[1]);
 else if(h==="#/community")community();
 else if(h==="#/class")classPage();
 else if((m=h.match(/^#\/class\/([A-Z0-9]{6})/)))teacherClass(m[1]);
 else if((m=h.match(/^#\/chat\/([A-Z0-9]{6})/)))chatPage(m[1]);
 else home();
}
function start(){$("#root").innerHTML="";route()}
document.addEventListener("click",e=>{const o=e.target.closest("[data-open]");if(o)location.hash="#/read/"+o.dataset.open});
addEventListener("hashchange",route);
addEventListener("pagehide",()=>DB.flush());
DB.init().then(()=>route());

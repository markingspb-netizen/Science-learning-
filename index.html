q:[["Detail","How fast can a peregrine falcon dive?",["More than 300 kilometres per hour","About 30 kilometres per hour","About 3 kilometres per hour","As fast as light"],0],
["Cause & effect","Why does a falcon tuck in its wings when diving?",["To reduce air resistance","To keep warm","To hide from people","To slow down"],1],
["Vocabulary","What is falconry?",["The art of training falcons to hunt","A falcon’s nest","A type of falcon food","A falcon race in the sky"],2]]},

{id:"a10",tp:"animals",e:"🐜",t:"Ants: Tiny Farmers",s:"Leafcutter ants grow their own food in underground gardens.",
p:["Ants are small, but they are powerful when they work together. An ant colony can contain millions of ants, and each one has a job. Some find food, some look after the young, and some guard the nest.",
"Leafcutter ants, which live in Central and South America, are farmers. They cut pieces of leaves and carry them back to their nest. But they do not eat the leaves!",
"Instead, they chew the leaves and use them to grow a fungus in underground gardens. The fungus is their food. Ants were farming like this for millions of years before humans planted their first crops."],
q:[["Detail","What do leafcutter ants do with the leaves?",["Use them to grow a fungus to eat","Eat them right away","Build houses with them","Throw them away"],2],
["Main idea","Why are leafcutter ants called farmers?",["They grow their own food in gardens","They raise cows","They plant trees","They work in fields with people"],2],
["Detail","What jobs can ants in a colony have?",["Finding food, caring for young and guarding the nest","Only sleeping","Only fighting","Only digging"],0]]},

/* ===================== PLANTS ===================== */
{id:"p1",tp:"plants",e:"🌿",t:"Photosynthesis: Making Food From Light",s:"Plants use sunlight, water and air to make their own food and give us oxygen.",
p:["Animals have to eat to get energy, but plants make their own food. They do it through a process called photosynthesis, which means ‘putting together with light’.",
"A plant takes in water through its roots and a gas called carbon dioxide from the air through tiny holes in its leaves. A green substance in the leaves called chlorophyll captures energy from sunlight. The plant uses this energy to turn water and carbon dioxide into sugar, its food.",
"Photosynthesis also makes oxygen, which the plant releases into the air. Almost all the oxygen we breathe comes from plants and tiny ocean organisms that photosynthesise."],
q:[["Vocabulary","What does photosynthesis mean?",["Putting together with light","Growing roots","Drinking water","Breathing out"],0],
["Detail","What captures energy from sunlight in leaves?",["Chlorophyll","Roots","Flowers","Sugar"],1],
["Detail","Which gas do plants release during photosynthesis?",["Oxygen","Carbon dioxide","Helium","Smoke"],2]]},

{id:"p2",tp:"plants",e:"🌴",t:"The Date Palm: Tree of Life",s:"For thousands of years, date palms gave food, shade and building materials in Arabia.",
p:["The date palm has been called the ‘tree of life’ in Arabia. For thousands of years, people here have eaten its sweet fruit and used every part of the tree.",
"Palm leaves were woven into mats, baskets and roofs. The trunks became beams for houses, and the fibres were twisted into ropes. Traditional houses called arish were built from palm fronds, which let the breeze pass through.",
"Date palms are either male or female, and only female trees produce dates. To get a good harvest, farmers climb the trees and pollinate the flowers by hand, carrying pollen from male flowers to female ones."],
q:[["Detail","What were palm leaves used for?",["Weaving mats, baskets and roofs","Making glass","Making fuel for cars","Nothing"],1],
["Detail","Which date palms produce dates?",["Only female trees","Only male trees","Both","Neither"],2],
["Inference","Why do farmers pollinate the flowers by hand?",["To get a good harvest of dates","To make the tree taller","To keep birds away","To change the colour of dates"],2]]},

{id:"p3",tp:"plants",e:"🌳",t:"Mangroves: Forests in Salt Water",s:"Mangrove trees grow in salty water, protect coasts and store carbon.",
p:["Most trees would die if their roots were in salt water, but mangroves grow happily along salty coasts. You can find mangrove forests in Abu Dhabi, Umm Al Quwain and other parts of the UAE.",
"Mangroves have special ways to survive. Some remove salt through their roots, and others push salt out through their leaves. Because mud has little oxygen, many mangroves grow pencil-shaped roots that stick up out of the mud to breathe.",
"Mangroves are very useful. Their tangled roots protect the coast from waves and storms, and they are nurseries where baby fish shelter. Mangroves also store large amounts of carbon, which helps fight climate change."],
q:[["Main idea","What makes mangroves special?",["They can grow in salty water","They grow only in deserts","They have no roots","They grow in snow"],0],
["Cause & effect","Why do some mangrove roots stick up out of the mud?",["To breathe, because mud has little oxygen","To catch fish","To scare birds","To collect rain"],1],
["Detail","How do mangroves help baby fish?",["They give them shelter, like a nursery","They feed them salt","They keep them out of the water","They make the water hotter"],2]]},

{id:"p4",tp:"plants",e:"🌼",t:"How Seeds Travel",s:"Plants cannot walk, so their seeds travel by wind, water and animals.",
p:["Plants cannot walk, but their seeds need to move away from the parent plant to find space and light. So plants have developed clever ways to send seeds travelling.",
"Some seeds fly. A dandelion seed has a tiny parachute of fluffy hairs that the wind can carry for kilometres. Some seeds float. Coconuts can drift across oceans and grow on faraway beaches.",
"Other seeds hitch a ride on animals. Some have tiny hooks that stick to fur. Others are hidden inside tasty fruit. Animals eat the fruit, walk away, and later drop the seeds in their droppings, often with a little fertiliser."],
q:[["Cause & effect","Why do seeds need to move away from the parent plant?",["To find space and light","To get away from animals","To find salt","Because the parent plant pushes them"],0],
["Detail","How does a dandelion seed travel?",["The wind carries its fluffy parachute","It floats in the ocean","It sticks to fur","It rolls downhill"],1],
["Detail","How can coconuts reach faraway beaches?",["By drifting across oceans","By flying","By being carried by ants","By rolling"],1]]},

{id:"p5",tp:"plants",e:"🦜",t:"Rainforests: The Planet’s Treasure Chest",s:"Tropical rainforests are home to a huge variety of plants and animals.",
p:["Tropical rainforests grow near the equator, where it is hot and rains almost every day. The largest is the Amazon rainforest in South America.",
"Rainforests are home to an enormous variety of living things. A single tree can hold hundreds of kinds of insects. Many plants found in rainforests have been used to make important medicines.",
"Rainforests have layers, like a building. The tallest trees poke out at the top. Below them is the canopy, a thick roof of leaves where most animals live. The forest floor is dark, because only a little sunlight gets through the leaves above."],
q:[["Detail","Where do tropical rainforests grow?",["Near the equator","Near the North Pole","On high mountains of ice","In dry deserts"],0],
["Vocabulary","What is the canopy?",["A thick roof of leaves where most animals live","The forest floor","A river in the forest","The roots of trees"],2],
["Cause & effect","Why is the forest floor dark?",["Only a little sunlight gets through the leaves above","It is always night there","The soil is black","Animals block the light"],2]]},

{id:"p6",tp:"plants",e:"🍄",t:"Fungi: Not Plants, Not Animals",s:"Mushrooms belong to their own kingdom and connect forests underground.",
p:["Mushrooms might look like plants, but they are not. They belong to a separate group of living things called fungi. Unlike plants, fungi cannot make their own food from sunlight.",
"The mushroom we see is only a small part of the fungus. Most of it lives underground as a huge network of thin threads called mycelium. These threads break down dead leaves and wood and return nutrients to the soil.",
"In many forests, mycelium connects to tree roots. The fungus helps trees get water and nutrients, and in return trees share sugar with the fungus. Some scientists call this network the ‘wood wide web’."],
q:[["Detail","How are fungi different from plants?",["They cannot make food from sunlight","They are always bigger","They live only in water","They have leaves"],0],
["Vocabulary","What is mycelium?",["A network of thin fungus threads underground","The top of a mushroom","A kind of tree","A forest animal"],1],
["Detail","What do trees give the fungus in return for help?",["Sugar","Water","Light","Seeds"],2]]},

{id:"p7",tp:"plants",e:"🌲",t:"Giants of the Forest",s:"The tallest trees on Earth are coast redwoods in California.",
p:["The tallest living tree in the world is a coast redwood in California, USA. Scientists named it Hyperion. It is about 116 metres tall, taller than a 30-storey building.",
"How does water get all the way to the top of such a tall tree? As water evaporates from the leaves, it pulls more water up through thin tubes inside the trunk, like sucking a drink up through a straw.",
"Redwoods have thick, spongy bark that protects them from fire and insects. Some coast redwoods are more than 2,000 years old. The exact location of Hyperion is kept secret to protect it from too many visitors."],
q:[["Detail","How tall is Hyperion?",["About 116 metres","About 16 metres","About 1,000 metres","About 2 metres"],0],
["Figurative language","Why does the author compare a tree to a straw?",["Water is pulled up through thin tubes, like a drink through a straw","Trees are hollow","Trees drink juice","Straws are made of wood"],1],
["Cause & effect","Why is Hyperion’s location kept secret?",["To protect it from too many visitors","Because nobody knows where it is","Because it moves","Because it is in another country"],2]]},

{id:"p8",tp:"plants",e:"🪴",t:"The Plant That Eats Insects",s:"The Venus flytrap snaps shut on insects to get nutrients.",
p:["Most plants get the nutrients they need from the soil. But the Venus flytrap grows in wet, boggy places in North and South Carolina, USA, where the soil is poor. So it catches insects to get extra nutrients.",
"Each trap is made of two leaves with tiny trigger hairs inside. If an insect touches a hair once, nothing happens. But if it touches hairs twice within about 20 seconds, the trap snaps shut in a fraction of a second.",
"This ‘count to two’ system stops the trap from closing on raindrops or falling leaves. Once the insect is caught, the plant releases juices to digest it over several days."],
q:[["Cause & effect","Why does the Venus flytrap catch insects?",["The soil where it grows is poor in nutrients","It is hungry for meat like a lion","It hates insects","It needs water from them"],0],
["Detail","What makes the trap snap shut?",["Trigger hairs touched twice within about 20 seconds","Any touch at all","Sunlight","Wind"],1],
["Inference","Why is the ‘count to two’ system useful?",["It stops the trap closing on raindrops or leaves","It makes the trap slower","It helps the plant count insects","It makes the flowers grow"],2]]}
);

A.push(
/* ===================== ENERGY & ENVIRONMENT ===================== */
{id:"n1",tp:"energy",e:"🔆",t:"Turning Sunlight Into Electricity",s:"Solar panels turn sunlight straight into electricity, and the UAE has plenty of sun.",
p:["The UAE has sunshine almost every day of the year, which makes it a perfect place for solar power. Huge solar parks, such as the Mohammed bin Rashid Al Maktoum Solar Park in Dubai, now cover large areas of desert.",
"Solar panels are made of many small units called solar cells, usually made from a material called silicon. When sunlight hits a solar cell, it knocks tiny particles called electrons loose. The moving electrons create an electric current.",
"Solar power is renewable, which means it will not run out, and it does not create smoke. One challenge is dust: sand settling on panels blocks sunlight, so many solar parks use robots to clean their panels."],
q:[["Detail","What material are solar cells usually made from?",["Silicon","Wood","Gold","Plastic"],1],
["Vocabulary","What does ‘renewable’ mean?",["It will not run out","It is very expensive","It is dangerous","It only works at night"],2],
["Cause & effect","Why do many solar parks use cleaning robots?",["Dust and sand block sunlight from the panels","The panels get too cold","Birds sit on them","To make them shine at night"],2]]},

{id:"n2",tp:"energy",e:"🌬️",t:"Catching the Wind",s:"Wind turbines turn moving air into electricity.",
p:["For hundreds of years, people used windmills to grind grain and pump water. Today, giant wind turbines use the wind to make electricity.",
"A wind turbine has long blades, like a giant fan. When the wind blows, it pushes the blades and makes them spin. The spinning blades turn a shaft connected to a generator, and the generator makes electricity.",
"Wind turbines are often built on hills or out at sea, where winds are strong and steady. Like solar power, wind power is renewable and clean. But turbines only work when the wind blows, so they are often combined with other kinds of power."],
q:[["Sequence","What happens after the wind spins the blades?",["The blades turn a shaft connected to a generator","The turbine stops","The wind gets stronger","The blades fall off"],1],
["Detail","Where are wind turbines often built?",["On hills or out at sea","Inside houses","In deep caves","Under the ground"],2],
["Cause & effect","Why is wind power often combined with other kinds of power?",["Turbines only work when the wind blows","Wind power is dirty","Turbines are too small","Wind power is not renewable"],2]]},

{id:"n3",tp:"energy",e:"🌡️",t:"The Greenhouse Effect",s:"Some gases trap heat around Earth. Too much of them is warming the planet.",
p:["A greenhouse is a glass building where plants grow. The glass lets sunlight in but keeps heat from escaping, so it stays warm inside even in winter.",
"Earth has something similar. Some gases in the air, like carbon dioxide, trap heat near the planet’s surface. This is called the greenhouse effect. Without it, Earth would be freezing cold.",
"The problem is that burning coal, oil and gas releases extra carbon dioxide. More of it traps more heat, and Earth’s average temperature is rising. This is called climate change. It melts ice, raises sea levels and causes more extreme weather."],
q:[["Vocabulary","What is the greenhouse effect?",["Gases in the air trapping heat near Earth","Plants growing in glass buildings","Earth turning green","The Sun getting hotter"],1],
["Inference","What would Earth be like without any greenhouse effect?",["Freezing cold","Much hotter","Exactly the same","Covered in plants"],1],
["Cause & effect","What causes extra carbon dioxide in the air?",["Burning coal, oil and gas","Planting trees","Using solar panels","Drinking water"],2]]},

{id:"n4",tp:"energy",e:"🥤",t:"The Plastic Problem",s:"Plastic lasts for hundreds of years and breaks into tiny pieces in the ocean.",
p:["Plastic is useful because it is light, cheap and strong. But the same strength makes it a problem. Most plastic does not rot. It can last for hundreds of years.",
"Every year, millions of tonnes of plastic end up in the ocean. Sea turtles may mistake plastic bags for jellyfish and eat them. Seabirds may feed bottle caps to their chicks.",
"Over time, sunlight and waves break plastic into tiny pieces called microplastics. They are so small that fish and other animals swallow them, and scientists have even found them in drinking water. Using less plastic, reusing it and recycling it can all help."],
q:[["Cause & effect","Why is plastic a problem in nature?",["Most plastic does not rot and lasts for hundreds of years","It melts too quickly","It is too heavy","It turns into water"],0],
["Detail","What might sea turtles mistake plastic bags for?",["Jellyfish","Fish","Rocks","Seaweed"],1],
["Vocabulary","What are microplastics?",["Tiny pieces of broken-down plastic","Very small bottles","Plastic made by microbes","A kind of fish"],2]]},

{id:"n5",tp:"energy",e:"♻️",t:"The Magic of Recycling Cans",s:"Recycling an aluminium can saves most of the energy needed to make a new one.",
p:["Recycling means turning used materials into new products. It saves raw materials, reduces rubbish and often saves energy.",
"Aluminium cans are recycling champions. Making a new can from recycled aluminium uses about 95 percent less energy than making it from raw materials dug out of the ground.",
"Aluminium can be recycled again and again without losing its quality. A can you recycle today could be back on a shop shelf as a new can in just a few weeks. Glass and paper can also be recycled, though paper fibres get shorter each time."],
q:[["Vocabulary","What does recycling mean?",["Turning used materials into new products","Throwing things away","Riding a bicycle","Buying new things"],0],
["Detail","How much less energy does a recycled aluminium can use?",["About 95 percent less","About 5 percent less","No difference","Twice as much"],1],
["Compare","How is recycling paper different from recycling aluminium?",["Paper fibres get shorter each time; aluminium keeps its quality","Paper cannot be recycled","Aluminium gets weaker each time","They are exactly the same"],2]]},

{id:"n6",tp:"energy",e:"🔋",t:"The Story of the Battery",s:"From Volta’s pile to lithium-ion, batteries store energy for later.",
p:["A battery stores energy in chemicals and releases it as electricity when you need it. Phones, laptops and electric cars all depend on batteries.",
"In 1800, an Italian scientist named Alessandro Volta built the first true battery. He stacked discs of two different metals, separated by cloth soaked in salt water. This ‘voltaic pile’ produced a steady electric current. The unit of electrical push, the volt, is named after him.",
"Today, most phones use lithium-ion batteries, which are light and can be recharged many times. In 2019, three scientists won the Nobel Prize in Chemistry for developing them."],
q:[["Detail","Who built the first true battery?",["Alessandro Volta","Isaac Newton","Thomas Edison","Marie Curie"],1],
["Detail","What is named after Volta?",["The volt","The battery","The phone","The metre"],1],
["Detail","Why are lithium-ion batteries useful in phones?",["They are light and can be recharged many times","They never need charging","They are made of salt water","They are very heavy"],2]]},

{id:"n7",tp:"energy",e:"🏞️",t:"Power From Falling Water",s:"Dams use the force of flowing water to make electricity.",
p:["Water flowing downhill carries a lot of energy. Hydropower plants use this energy to make electricity.",
"Most hydropower plants use a dam, a huge wall built across a river. The dam holds back a large lake of water. When gates open, the water rushes down through tunnels and spins turbines, which turn generators to make electricity.",
"The largest power station in the world is the Three Gorges Dam in China. Hydropower is renewable and clean, but building a dam floods valleys, and people and animals living there may have to move."],
q:[["Vocabulary","What is a dam?",["A huge wall built across a river","A kind of turbine","A small lake","A boat"],1],
["Detail","What is the largest power station in the world?",["The Three Gorges Dam in China","Barakah","A solar park in Dubai","A wind farm at sea"],2],
["Detail","What is one problem with building a dam?",["It floods valleys and people may have to move","It makes smoke","It is not renewable","It stops all rain"],2]]},

{id:"n8",tp:"energy",e:"🚗",t:"Electric Cars on the Road",s:"Electric cars use batteries and motors instead of petrol engines.",
p:["Most cars have engines that burn petrol. Burning fuel releases carbon dioxide and other gases that pollute the air.",
"An electric car has no petrol engine. Instead, it has a large battery that powers an electric motor. Electric cars are quiet and produce no exhaust fumes from the car itself. Drivers charge them by plugging them in, a bit like charging a phone.",
"Electric cars are only as clean as the electricity that charges them. If the electricity comes from solar, wind or nuclear power, the car’s total pollution is much lower. Countries including the UAE are building more charging stations to help people switch."],
q:[["Detail","What powers an electric car?",["A battery and an electric motor","A petrol engine","Solar panels on the roof only","Pedals"],1],
["Inference","When is an electric car cleanest?",["When it is charged with electricity from solar, wind or nuclear power","When it drives very fast","When it is painted green","When it uses petrol"],2],
["Detail","What are countries like the UAE building to help people switch?",["More charging stations","More petrol stations","More roads for horses","More car parks"],2]]},

{id:"n9",tp:"energy",e:"🛡️",t:"Fixing the Hole in the Sky",s:"The world worked together to protect the ozone layer, and it is healing.",
p:["High in the sky is a layer of gas called ozone. It works like sunscreen for the planet, blocking much of the Sun’s harmful ultraviolet light, which can burn skin and damage eyes.",
"In the 1980s, scientists discovered that the ozone layer was getting thinner, especially above Antarctica. The cause was chemicals called CFCs, which were used in fridges and spray cans.",
"In 1987, countries around the world signed an agreement called the Montreal Protocol to stop using CFCs. It worked. Scientists say the ozone layer is slowly healing. It shows that when the world works together, big problems can be solved."],
q:[["Figurative language","Why does the author compare ozone to sunscreen?",["It blocks harmful ultraviolet light","It is a cream","It smells nice","It makes the sky blue"],0],
["Cause & effect","What made the ozone layer thinner?",["Chemicals called CFCs","Volcanoes","Airplanes","Too much rain"],1],
["Author’s purpose","What lesson does the last paragraph teach?",["When the world works together, big problems can be solved","Fridges are dangerous","Antarctica is very cold","Ozone is not important"],2]]},

/* ===================== TECHNOLOGY ===================== */
{id:"t1",tp:"tech",e:"📜",t:"The Machine That Spread Knowledge",s:"Gutenberg’s printing press made books cheap and changed the world.",
p:["Long ago, every book in Europe had to be copied by hand. It could take months to copy one book, so books were rare and very expensive.",
"Around 1440, a German goldsmith named Johannes Gutenberg built a printing press with movable type. Each letter was a small metal block. Printers could arrange the letters into pages, cover them with ink and press them onto paper, again and again.",
"Suddenly, books could be made quickly and cheaply. Ideas about science, religion and the world spread faster than ever before, and many more people learned to read."],
q:[["Cause & effect","Why were books rare before the printing press?",["They had to be copied by hand, which took months","Paper did not exist","Nobody wanted to read","Kings banned them"],0],
["Vocabulary","What was ‘movable type’?",["Small metal blocks for each letter that could be rearranged","A moving truck for books","A type of ink","A book that moves"],1],
["Detail","What was one result of the printing press?",["More people learned to read","Books became more expensive","People stopped writing","Paper was banned"],2]]},

{id:"t2",tp:"tech",e:"☎️",t:"Mr Watson, Come Here!",s:"In 1876, the telephone sent the human voice down a wire for the first time.",
p:["Before the telephone, the fastest way to send a message far away was the telegraph, which sent codes of dots and dashes along wires. But it could not carry a human voice.",
"In 1876, Alexander Graham Bell received a patent for the telephone. His invention changed the vibrations of a voice into an electric signal, sent it through a wire, and changed it back into sound at the other end.",
"The first words Bell spoke on his telephone were to his assistant in the next room: ‘Mr Watson, come here. I want to see you.’ Today, smartphones send voices as radio waves and digital signals around the world in an instant."],
q:[["Compare","What could the telephone do that the telegraph could not?",["Carry a human voice","Send messages along wires","Use electricity","Send dots and dashes"],0],
["Sequence","What did Bell’s telephone do first with a voice?",["Changed its vibrations into an electric signal","Wrote it down","Recorded it on paper","Sent it by post"],1],
["Detail","Who heard the first words on Bell’s telephone?",["His assistant, Mr Watson","The king","His mother","A newspaper"],2]]},

{id:"t3",tp:"tech",e:"🌐",t:"The Birth of the Web",s:"Tim Berners-Lee invented the World Wide Web in 1989 and gave it to everyone for free.",
p:["The internet and the World Wide Web are not the same thing. The internet is a giant network of connected computers. The Web is a way of sharing pages of information over that network, linked together.",
"In 1989, a British scientist named Tim Berners-Lee was working at CERN, a physics laboratory in Switzerland. Scientists there struggled to share information between different computers. He proposed a system of pages connected by links, which he called the World Wide Web.",
"Berners-Lee decided not to charge money for his invention. He gave it to the world for free. That decision helped the Web grow quickly into the tool billions of people use every day."],
q:[["Compare","What is the difference between the internet and the Web?",["The internet is a network of computers; the Web is linked pages shared over it","They are exactly the same","The Web is older","The internet is a website"],0],
["Detail","Where was Tim Berners-Lee working when he invented the Web?",["At CERN in Switzerland","At NASA","At a bank","At a school in Dubai"],1],
["Cause & effect","What helped the Web grow quickly?",["Berners-Lee gave it to the world for free","It was very expensive","Only scientists could use it","It was secret"],2]]},

{id:"t4",tp:"tech",e:"✈️",t:"Twelve Seconds That Changed Travel",s:"In 1903, the Wright brothers made the first powered airplane flight.",
p:["Orville and Wilbur Wright were brothers who ran a bicycle shop in Ohio, USA. They were fascinated by the idea of flying and studied how birds use their wings.",
"They built gliders and tested them for years. They even built their own wind tunnel to test wing shapes. Their big idea was a way to control the plane by twisting the wings, so the pilot could keep it balanced.",
"On 17 December 1903, at Kitty Hawk in North Carolina, Orville flew their plane, the Flyer, for 12 seconds and about 37 metres. It was the first powered, controlled flight of an airplane. Today, planes carry millions of people around the world every day."],
q:[["Detail","What did the Wright brothers study to learn about flying?",["How birds use their wings","How fish swim","How cars drive","How balloons float"],0],
["Detail","Why did they build a wind tunnel?",["To test wing shapes","To dry their clothes","To cool their shop","To make music"],1],
["Detail","How long was the first powered flight?",["12 seconds","12 hours","12 minutes","12 days"],2]]},

{id:"t5",tp:"tech",e:"🤖",t:"Where Did Robots Come From?",s:"The word robot came from a play, and now robots work in factories, homes and space.",
p:["The word robot first appeared in a play in 1920 by the Czech writer Karel Čapek. It comes from a Czech word meaning ‘forced labour’, or hard work.",
"Today, a robot is a machine that can sense its surroundings, make decisions and carry out tasks by itself. Sensors such as cameras act like its eyes. A computer acts like its brain. Motors act like its muscles.",
"Robots do jobs that are boring, dangerous or very precise. They build cars in factories, help surgeons in hospitals, clean floors in homes and explore places people cannot go, like the surface of Mars."],
q:[["Detail","Where did the word robot first appear?",["In a play written in 1920","In a science book from 1800","On Mars","In an ancient Arabic poem"],0],
["Figurative language","In a robot, what acts like its brain?",["A computer","A camera","A motor","A wheel"],1],
["Detail","What kinds of jobs do robots often do?",["Boring, dangerous or very precise jobs","Only cooking","Only singing","No jobs at all"],2]]},

{id:"t6",tp:"tech",e:"🧩",t:"How Computers Learn",s:"Artificial intelligence learns patterns from huge numbers of examples.",
p:["Artificial intelligence, or AI, is when computers do tasks that usually need human intelligence, like recognising faces, understanding speech or translating languages.",
"Many AI systems learn from examples instead of following only fixed rules. For example, to recognise cats, an AI can study thousands of photos labelled ‘cat’ or ‘not cat’. Slowly, it finds patterns, like the shape of ears and whiskers.",
"In 1997, a computer called Deep Blue beat the world chess champion Garry Kasparov. Today AI helps doctors read X-rays and helps scientists discover new medicines. But AI can make mistakes, so people still need to check its work."],
q:[["Detail","How do many AI systems learn?",["From many examples","By sleeping","By reading one rule","They never learn"],1],
["Detail","What happened in 1997?",["A computer called Deep Blue beat the world chess champion","The first robot was built","AI learned to cook","Computers were invented"],2],
["Inference","Why do people still need to check AI’s work?",["AI can make mistakes","AI is always perfect","AI does not work at all","It is the law"],2]]},

{id:"t7",tp:"tech",e:"🖨️",t:"Printing in 3D",s:"3D printers build objects layer by layer, even houses.",
p:["A normal printer puts ink on flat paper. A 3D printer builds solid objects you can hold.",
"It starts with a computer design. The printer then builds the object one thin layer at a time, usually by melting plastic and squeezing it out of a nozzle, a bit like decorating a cake with icing. Layer by layer, the object grows upward.",
"3D printing is used to make toys, spare parts, prosthetic hands and even buildings. Dubai has built offices using giant 3D printers that print with concrete. Astronauts have also tested 3D printers to make tools in space."],
q:[["Detail","How does a 3D printer build an object?",["One thin layer at a time","All at once","By carving a block of wood","By folding paper"],1],
["Figurative language","What does the author compare 3D printing to?",["Decorating a cake with icing","Painting a wall","Writing a letter","Building with sand"],1],
["Detail","What has Dubai built with 3D printers?",["Offices printed with concrete","Cars","Airplanes","Islands"],2]]},

{id:"t8",tp:"tech",e:"📍",t:"How GPS Knows Where You Are",s:"Satellites send signals that let your phone work out its location.",
p:["When you use a map on a phone, it shows exactly where you are. This is thanks to GPS, the Global Positioning System.",
"GPS uses a group of satellites orbiting Earth. Each satellite constantly sends out a signal saying what time it is and where the satellite is. Your phone receives these signals and measures how long each one took to arrive.",
"Using signals from at least four satellites, the phone can calculate its position. The satellites carry very precise atomic clocks, because even a tiny timing mistake could put your location off by kilometres."],
q:[["Detail","What does each GPS satellite send out?",["A signal with the time and its position","Photos of your house","Music","Weather reports"],1],
["Detail","How many satellites does a phone need signals from?",["At least four","Only one","Exactly two","One hundred"],2],
["Cause & effect","Why do GPS satellites need very precise clocks?",["A tiny timing mistake could put your location off by kilometres","To wake up astronauts","To count the days","To play music on time"],2]]},

{id:"t9",tp:"tech",e:"🩻",t:"The Accidental Discovery of X-rays",s:"In 1895, a mysterious glow led to a way to see inside the body.",
p:["In 1895, a German scientist named Wilhelm Röntgen was experimenting with electricity in a glass tube. He noticed that a screen across the room started to glow, even though the tube was covered with black paper.",
"Röntgen realised that an invisible kind of ray was passing through the paper. Because he did not know what it was, he called it ‘X-ray’, since X often stands for something unknown in mathematics.",
"X-rays pass through soft parts of the body but are blocked by bones. One of the first X-ray pictures showed the bones of his wife’s hand with her ring. In 1901, Röntgen won the very first Nobel Prize in Physics."],
q:[["Detail","What did Röntgen notice during his experiment?",["A screen across the room started to glow","His tube exploded","The lights went out","His hand turned blue"],0],
["Cause & effect","Why did Röntgen call them ‘X-rays’?",["X often stands for something unknown","His name starts with X","They are shaped like an X","X means fast"],1],
["Detail","Why do bones show up in X-ray pictures?",["Bones block X-rays while soft parts let them pass","Bones glow in the dark","Bones are made of metal","X-rays only see skin"],2]]},

{id:"t10",tp:"tech",e:"🔗",t:"Velcro: An Idea From a Dog Walk",s:"Sticky seeds on a dog’s fur inspired the invention of Velcro.",
p:["In the 1940s, a Swiss engineer named George de Mestral went for a walk in the mountains with his dog. When they got home, both his trousers and his dog’s fur were covered in burrs, small seeds that stuck tightly.",
"Curious, he looked at the burrs under a microscope. He saw that they were covered in tiny hooks that caught on loops in fabric and fur.",
"De Mestral copied this idea to make a fastener with two strips: one with tiny hooks and one with tiny loops. He called it Velcro. Copying ideas from nature like this is called biomimicry."],
q:[["Detail","What stuck to de Mestral’s trousers and his dog?",["Burrs, small seeds with hooks","Mud","Sand","Insects"],0],
["Detail","What did he see under the microscope?",["Tiny hooks on the burrs","Tiny wheels","Glue","Hairs that were wet"],1],
["Vocabulary","What is biomimicry?",["Copying ideas from nature to invent things","Studying dogs","A type of microscope","A sticky glue"],2]]},

/* ===================== SCIENTISTS ===================== */
{id:"c1",tp:"people",e:"👁️",t:"Ibn al-Haytham: Father of Optics",s:"A thousand years ago, he proved that we see because light enters our eyes.",
p:["About a thousand years ago, a scientist named Ibn al-Haytham was born in Basra, in today’s Iraq. He later worked in Cairo. He is often called the father of optics, the science of light and vision.",
"In ancient times, many people believed that our eyes send out rays to see things. Ibn al-Haytham showed that the opposite is true: we see because light bounces off objects and travels into our eyes.",
"He tested his ideas with careful experiments, including with a dark room with a tiny hole, called a camera obscura, which projects an upside-down image of the outside world. His method of testing ideas with experiments is an important part of science today."],
q:[["Vocabulary","What is optics?",["The science of light and vision","The study of plants","The study of numbers","The science of sound"],0],
["Compare","How was Ibn al-Haytham’s idea different from the old belief?",["He showed light enters our eyes, instead of eyes sending out rays","He said we see with our ears","He said light does not exist","He agreed with the old idea"],1],
["Detail","What does a camera obscura show?",["An upside-down image of the outside world","A photo printed on paper","A map of the stars","Nothing at all"],2]]},

{id:"c2",tp:"people",e:"🧪",t:"Marie Curie: Two Nobel Prizes",s:"Marie Curie discovered two new elements and won two Nobel Prizes.",
p:["Marie Curie was born in Poland in 1867. At that time, women in Poland were not allowed to go to university, so she moved to Paris to study physics and mathematics.",
"With her husband, Pierre, she studied radioactivity, the energy given off by certain elements. Together they discovered two new elements. Marie named one polonium, after her home country, Poland, and the other radium.",
"In 1903, she became the first woman to win a Nobel Prize. In 1911, she won a second one, in a different science. She is still the only person to win Nobel Prizes in two different sciences: physics and chemistry."],
q:[["Cause & effect","Why did Marie Curie move to Paris?",["Women in Poland could not go to university","She wanted to be an artist","Her family moved for work","She was sent by the king"],0],
["Detail","Why did she name one element polonium?",["After her home country, Poland","After her husband","After a city in France","After a star"],1],
["Detail","What makes Marie Curie unique among Nobel winners?",["She won Nobel Prizes in two different sciences","She won the first prize ever","She won ten prizes","She refused the prize"],2]]},

{id:"c3",tp:"people",e:"🍎",t:"Isaac Newton and the Falling Apple",s:"Newton explained gravity and the laws of motion.",
p:["Isaac Newton was an English scientist born in 1643. A famous story says he was sitting under a tree when an apple fell. He wondered: why does the apple fall straight down and not sideways or up?",
"Newton realised that the same force that pulls an apple to the ground also keeps the Moon travelling around Earth. He called this force gravity. Every object pulls on every other object, and bigger objects pull harder.",
"In 1687, Newton published a great book explaining gravity and his three laws of motion. His first law says that an object keeps doing what it is doing, staying still or moving, unless a force acts on it."],
q:[["Main idea","What big idea did Newton have about gravity?",["The same force pulls apples down and keeps the Moon around Earth","Gravity only works on apples","Gravity pushes things up","The Moon has no gravity"],1],
["Detail","Which objects pull harder with gravity?",["Bigger objects","Smaller objects","Red objects","Cold objects"],1],
["Detail","What does Newton’s first law say?",["An object keeps doing what it is doing unless a force acts on it","Everything falls up","Apples are heavier than the Moon","Motion is impossible"],2]]},

{id:"c4",tp:"people",e:"🔭",t:"Galileo Looks Up",s:"Galileo’s telescope revealed moons around Jupiter and changed astronomy.",
p:["In 1609, the Italian scientist Galileo Galilei heard about a new invention from the Netherlands: a tube with lenses that made faraway things look closer. He built his own, better telescope.",
"When he pointed it at the sky, he made amazing discoveries. He saw mountains and craters on the Moon. And in 1610, he found four moons travelling around Jupiter.",
"At that time, many people believed everything in the sky circled Earth. Jupiter’s moons proved that this was not true. Galileo also supported the idea that Earth travels around the Sun, which got him into serious trouble with powerful leaders of his time."],
q:[["Detail","What did Galileo see on the Moon?",["Mountains and craters","Water and trees","People","Nothing"],1],
["Detail","What did Galileo discover in 1610?",["Four moons travelling around Jupiter","The planet Pluto","The first black hole","Rings around Earth"],1],
["Cause & effect","Why were Jupiter’s moons important?",["They proved that not everything in the sky circles Earth","They were made of gold","They could be visited","They made Jupiter brighter"],2]]},

{id:"c5",tp:"people",e:"🔢",t:"Al-Khwarizmi: The Man Behind Algebra",s:"A scholar in Baghdad gave us algebra and the word ‘algorithm’.",
p:["Over 1,200 years ago, Baghdad had a famous centre of learning called the House of Wisdom. Scholars there translated and studied books from Greece, Persia and India.",
"One of these scholars was Muhammad ibn Musa al-Khwarizmi. He wrote a book that explained how to solve equations step by step. The word ‘al-jabr’ in its title became the word algebra.",
"Al-Khwarizmi also helped spread the Hindu-Arabic numbers we use today, including zero. When his name was translated into Latin, it became ‘Algoritmi’. That is where the word algorithm comes from: a set of step-by-step instructions, like the ones computers follow."],
q:[["Detail","What was the House of Wisdom?",["A famous centre of learning in Baghdad","A palace for a king","A school for soldiers","A hospital"],0],
["Detail","Which word comes from ‘al-jabr’?",["Algebra","Alphabet","Alarm","Album"],1],
["Vocabulary","What is an algorithm?",["A set of step-by-step instructions","A type of number","A computer screen","A book title"],2]]},

{id:"c6",tp:"people",e:"🐢",t:"Darwin and the Galápagos",s:"Charles Darwin’s voyage led to the theory of evolution by natural selection.",
p:["In 1831, a young Englishman named Charles Darwin set off on a ship called HMS Beagle for a five-year voyage around the world. He collected plants, animals and fossils everywhere he went.",
"On the Galápagos Islands, he noticed that finches on different islands had different beak shapes. Birds with thick beaks cracked hard seeds, and birds with thin beaks caught insects.",
"Darwin developed the idea of natural selection. Living things with features that help them survive are more likely to have young, and pass those features on. Over a very long time, species change. He explained this in his 1859 book ‘On the Origin of Species’."],
q:[["Detail","What was the name of Darwin’s ship?",["HMS Beagle","Titanic","Apollo","Flyer"],0],
["Detail","What did Darwin notice about the finches?",["Birds on different islands had different beak shapes","They could all talk","They were all the same","They had no beaks"],1],
["Vocabulary","What is natural selection?",["Living things with helpful features survive and pass them on","Choosing pets at a shop","Picking the best fruit","Animals voting for a leader"],2]]},

{id:"c7",tp:"people",e:"💡",t:"Einstein’s Big Ideas",s:"Albert Einstein changed how we think about space, time and light.",
p:["Albert Einstein was born in Germany in 1879. As a child, he was very curious and loved puzzles. In 1905, while working in a patent office in Switzerland, he published several papers that changed physics.",
"One idea was his theory of relativity. It says that time and space are not fixed. For example, time passes slightly slower for something that moves very fast. Another idea was his famous equation E = mc², which shows that a small amount of matter contains a huge amount of energy.",
"Many people think Einstein won the Nobel Prize for relativity, but he did not. He won it in 1921 for explaining the photoelectric effect, how light can knock electrons out of metal. This idea later helped make solar panels possible."],
q:[["Detail","Where was Einstein working in 1905?",["In a patent office in Switzerland","At NASA","At a university in America","On a ship"],0],
["Detail","What does E = mc² show?",["A small amount of matter contains a huge amount of energy","The speed of sound","How plants grow","How to add numbers"],1],
["Detail","What did Einstein win the Nobel Prize for?",["Explaining the photoelectric effect","The theory of relativity","Inventing the light bulb","Discovering gravity"],2]]},

{id:"c8",tp:"people",e:"🧮",t:"Katherine Johnson: The Human Computer",s:"Her maths helped send American astronauts into orbit and to the Moon.",
p:["Before electronic computers were common, NASA employed people called ‘computers’ to do difficult calculations by hand. One of the most brilliant was Katherine Johnson, an African American mathematician.",
"Johnson calculated the paths that spacecraft needed to follow. In 1962, astronaut John Glenn was preparing to orbit Earth. NASA had started using electronic computers, but Glenn did not fully trust them. He asked for Johnson to check the numbers herself. She did, and the flight was a success.",
"She also worked on calculations for the Apollo 11 Moon landing. In 2015, she received the Presidential Medal of Freedom, and her story was told in the book and film ‘Hidden Figures’."],
q:[["Vocabulary","What did ‘computers’ mean at NASA before electronic computers?",["People who did calculations by hand","Robots","Typewriters","Rockets"],0],
["Cause & effect","Why did John Glenn ask for Katherine Johnson?",["He did not fully trust the new electronic computers","She was his sister","She was the pilot","She built the rocket"],1],
["Detail","What book and film told her story?",["Hidden Figures","Cosmos","The Martian","Apollo 13"],2]]},

{id:"c9",tp:"people",e:"🐒",t:"Jane Goodall and the Chimpanzees",s:"Patient observation revealed that chimpanzees make and use tools.",
p:["In 1960, a young British woman named Jane Goodall travelled to Gombe in Tanzania, Africa, to study wild chimpanzees. At first, the chimpanzees ran away whenever she came near.",
"Goodall was patient. She sat quietly every day until the chimpanzees got used to her. Then she saw something amazing: a chimpanzee stripped leaves from a twig and pushed it into a termite mound to fish out termites to eat.",
"At the time, scientists believed only humans made tools. Goodall’s discovery changed that idea. She also showed that chimpanzees have personalities, feelings and families, and she spent her life working to protect them."],
q:[["Detail","Where did Jane Goodall study chimpanzees?",["Gombe in Tanzania","The Amazon rainforest","A zoo in London","The Arabian desert"],0],
["Detail","How did Goodall get the chimpanzees to accept her?",["She sat quietly and patiently every day","She gave them toys","She dressed as a chimpanzee","She used a robot"],1],
["Cause & effect","Why was the termite fishing discovery so important?",["Scientists believed only humans made tools","Termites are rare","Chimpanzees do not eat","It was the first time she saw a chimp"],2]]},

{id:"c10",tp:"people",e:"🦠",t:"Fleming’s Lucky Mould",s:"A forgotten dish of bacteria led to penicillin, the first antibiotic.",
p:["In 1928, a Scottish scientist named Alexander Fleming was studying bacteria in his London laboratory. Before going on holiday, he left some dishes of bacteria on his bench.",
"When he came back, he noticed something strange. A mould had grown on one dish, and all around the mould, the bacteria had died. The mould was making a substance that killed bacteria. Fleming named it penicillin.",
"Years later, other scientists found a way to produce penicillin in large amounts. It became the first widely used antibiotic, a medicine that kills bacteria. Antibiotics have saved millions of lives, but they do not work against viruses like the common cold."],
q:[["Detail","What did Fleming notice when he came back from holiday?",["Bacteria had died around a mould","His laboratory was flooded","His dishes were stolen","A new animal was born"],1],
["Vocabulary","What is an antibiotic?",["A medicine that kills bacteria","A type of virus","A kind of mould","A holiday"],2],
["Detail","What do antibiotics NOT work against?",["Viruses like the common cold","Bacteria","Infections from cuts","Some diseases"],2]]}
);

A.push(
/* ===================== OCEAN ===================== */
{id:"o1",tp:"ocean",e:"🪸",t:"Coral Reefs: Cities Under the Sea",s:"Corals are tiny animals that build huge reefs, but warm water puts them in danger.",
p:["Coral reefs look like colourful rocks or plants, but they are built by tiny animals called coral polyps. Each polyp builds a hard skeleton around itself. Over thousands of years, millions of these skeletons pile up to form a reef. The UAE has coral reefs in both the Arabian Gulf and the Gulf of Oman.",
"Reefs cover a tiny part of the ocean floor, but about a quarter of all ocean species depend on them. They are like busy underwater cities full of fish, crabs, turtles and sharks.",
"Corals get their colours from tiny algae living inside them. When the water gets too hot, the corals push the algae out and turn white. This is called coral bleaching. If the water stays hot for too long, the corals can die."],
q:[["Detail","What builds coral reefs?",["Tiny animals called coral polyps","Fish","Divers","Volcanoes"],0],
["Figurative language","Why does the author compare reefs to cities?",["They are busy places where many creatures live","They have roads and cars","They are made of concrete","People live there"],1],
["Cause & effect","What causes coral bleaching?",["Water that is too hot","Too many fish","Cold winters","Sunscreen"],2]]},

{id:"o2",tp:"ocean",e:"🌑",t:"The Deepest Place on Earth",s:"The Challenger Deep is about 11 kilometres below the ocean surface.",
p:["The deepest place in the ocean is the Challenger Deep, in the Mariana Trench in the western Pacific Ocean. It is about 11,000 metres deep. If you put Mount Everest there, its peak would still be more than two kilometres under water.",
"At that depth, there is no sunlight at all, and the water is close to freezing. The pressure of the water above is enormous, more than 1,000 times the air pressure at the surface. It would crush a human instantly.",
"In 1960, two explorers, Jacques Piccard and Don Walsh, reached the bottom in a special deep-sea vessel called the Trieste. Even there, they saw signs of life. Scientists have since found strange creatures like amphipods and snailfish living in the trench."],
q:[["Detail","Where is the Challenger Deep?",["In the Mariana Trench in the Pacific Ocean","In the Arabian Gulf","Under the North Pole","In a lake in Africa"],0],
["Figurative language","Why does the author mention Mount Everest?",["To show how incredibly deep the trench is","Because Everest is in the ocean","To talk about climbing","Because Everest is very cold"],0],
["Detail","Who reached the bottom in 1960?",["Jacques Piccard and Don Walsh","Neil Armstrong and Buzz Aldrin","Charles Darwin","The Wright brothers"],2]]},

{id:"o3",tp:"ocean",e:"🌊",t:"What Makes the Tides?",s:"The Moon’s gravity pulls on the oceans, making the sea rise and fall.",
p:["If you spend a day at the beach, you will notice that the sea slowly moves up the sand and then back down. These changes are called tides.",
"Tides are caused mainly by the Moon. The Moon’s gravity pulls on Earth’s oceans, making the water bulge out on the side facing the Moon. There is also a bulge on the opposite side of Earth. As Earth spins, most coasts pass through both bulges, so they get two high tides and two low tides about every day.",
"The Sun also affects tides. When the Sun, Moon and Earth line up, at full moon and new moon, their pulls combine to make extra-high tides called spring tides."],
q:[["Cause & effect","What mainly causes tides?",["The Moon’s gravity","The wind","Fish swimming","Rain"],1],
["Detail","How many high tides do most coasts get about every day?",["Two","One","Ten","None"],1],
["Vocabulary","What are spring tides?",["Extra-high tides when the Sun, Moon and Earth line up","Tides that only happen in spring","Tides in rivers","Very small tides"],2]]},

{id:"o4",tp:"ocean",e:"🐋",t:"The Blue Whale: Biggest Ever",s:"The blue whale is the largest animal that has ever lived, but it eats tiny krill.",
p:["The blue whale is the largest animal that has ever lived, bigger than any dinosaur. It can grow to about 30 metres long, as long as three buses in a row. Its heart is about the size of a small car.",
"Surprisingly, this giant eats some of the smallest animals in the sea: tiny shrimp-like creatures called krill. Instead of teeth, a blue whale has baleen, comb-like plates in its mouth. It gulps a huge mouthful of water and then pushes the water out through the baleen, trapping the krill inside.",
"Blue whales are also among the loudest animals on Earth. Their low calls can travel hundreds of kilometres through the ocean."],
q:[["Detail","How long can a blue whale grow?",["About 30 metres","About 3 metres","About 300 metres","About 1 metre"],0],
["Vocabulary","What is baleen?",["Comb-like plates in a whale’s mouth","A whale’s tooth","A kind of fish","A whale’s tail"],1],
["Detail","How far can a blue whale’s calls travel?",["Hundreds of kilometres","A few metres","Only to the surface","Around the Moon"],2]]},

{id:"o5",tp:"ocean",e:"🧂",t:"Why Is the Sea Salty?",s:"Rivers carry minerals to the sea, and evaporation leaves the salt behind.",
p:["Rain is fresh water, and so are most rivers. So why is the sea salty?",
"When rain falls on land, it slowly breaks down rocks and dissolves tiny amounts of minerals, including salt. Rivers carry these minerals to the sea. When sea water evaporates in the Sun, the water rises into the air, but the salt stays behind. Over millions of years, the salt has built up.",
"On average, sea water is about 3.5 percent salt. The Arabian Gulf is saltier than most oceans, because it is shallow and hot, so a lot of water evaporates. The UAE removes the salt from sea water in desalination plants to make drinking water."],
q:[["Cause & effect","Where does the salt in the sea come from?",["Minerals carried from rocks by rivers","Fish make it","Salt is dropped from ships","Clouds"],1],
["Cause & effect","Why is the Arabian Gulf saltier than most oceans?",["It is shallow and hot, so a lot of water evaporates","More salt rivers flow into it","People add salt","It never rains there at all"],2],
["Vocabulary","What does a desalination plant do?",["Removes salt from sea water to make drinking water","Adds salt to food","Grows plants in the sea","Makes electricity from salt"],2]]},

{id:"o6",tp:"ocean",e:"✨",t:"Living Lights",s:"Many sea creatures make their own light, called bioluminescence.",
p:["In the deep ocean, it is completely dark. Yet many creatures there glow. They make their own light through a chemical reaction in their bodies. This is called bioluminescence.",
"Animals use their lights in different ways. The anglerfish has a glowing lure on its head that attracts small fish close to its mouth. Some squid release a cloud of glowing liquid to confuse predators. Other animals use light to find mates.",
"Bioluminescence also happens on land. Fireflies flash their lights to signal to each other. And on some beaches at night, tiny plankton make the waves sparkle blue when they are disturbed."],
q:[["Vocabulary","What is bioluminescence?",["Light made by living things through a chemical reaction","Light from the Moon","A type of electricity","A lamp underwater"],0],
["Detail","How does the anglerfish use its light?",["To attract small fish close to its mouth","To read","To warm the water","To scare whales"],1],
["Detail","What makes some waves sparkle blue at night?",["Tiny plankton","Moonlight","Pollution","Jellyfish lamps"],2]]},

{id:"o7",tp:"ocean",e:"🦈",t:"Sharks: Older Than Trees",s:"Sharks have been around for over 400 million years, and the biggest one eats plankton.",
p:["Sharks were swimming in the oceans more than 400 million years ago. That means sharks existed before dinosaurs, and even before the first trees grew on land.",
"A shark’s skeleton is not made of bone. It is made of cartilage, the same flexible material that is in your nose and ears. This makes sharks light and flexible in the water. Many sharks also replace their teeth throughout their lives.",
"Not all sharks are hunters of big prey. The whale shark, the largest fish in the world, eats tiny plankton by filtering sea water. Whale sharks visit the waters of the UAE and are gentle with divers."],
q:[["Detail","Which came first?",["Sharks","Trees","Dinosaurs","Humans"],0],
["Detail","What is a shark’s skeleton made of?",["Cartilage","Bone","Wood","Metal"],1],
["Detail","What does the whale shark eat?",["Tiny plankton","Whales","Divers","Seaweed only"],2]]},

{id:"o8",tp:"ocean",e:"🐄",t:"Dugongs: The Gentle Sea Cows",s:"Abu Dhabi’s waters are home to one of the world’s largest groups of dugongs.",
p:["The dugong is a large, gentle sea mammal. It is sometimes called a ‘sea cow’ because it spends most of its day grazing on seagrass on the sea floor, like a cow eating grass in a field.",
"Dugongs breathe air, so they must come up to the surface every few minutes. Mothers usually have just one calf at a time and care for it for a long time. Because they have so few babies, their numbers grow back very slowly.",
"The waters around Abu Dhabi are home to one of the largest dugong populations in the world, second only to Australia. Protecting seagrass beds and keeping fishing nets away from dugongs helps keep them safe."],
q:[["Vocabulary","Why are dugongs called ‘sea cows’?",["They graze on seagrass like cows eat grass","They give milk to people","They have horns","They live on farms"],0],
["Cause & effect","Why do dugong numbers grow back slowly?",["Mothers have very few babies","They live too long","They eat too much","They cannot swim"],1],
["Detail","Which place has the largest dugong population?",["Australia","Abu Dhabi","Japan","Antarctica"],2]]},

/* ===================== CHEMISTRY & MATTER ===================== */
{id:"m1",tp:"matter",e:"🧊",t:"Solid, Liquid, Gas",s:"Everything around us is matter, and matter can change from one state to another.",
p:["Everything around you is made of matter: your desk, the water you drink and the air you breathe. Matter usually comes in three states: solid, liquid and gas.",
"In a solid, like ice, tiny particles are packed tightly and only vibrate in place, so a solid keeps its shape. In a liquid, like water, the particles can slide past each other, so a liquid takes the shape of its container. In a gas, like steam, particles move fast and spread out to fill any space.",
"Heating and cooling can change matter from one state to another. Ice melts into water, and water boils into steam. There is also a fourth state, called plasma, found in lightning and in the stars."],
q:[["Detail","Why does a solid keep its shape?",["Its particles are packed tightly and only vibrate in place","Its particles move very fast","It has no particles","It is always cold"],1],
["Detail","What happens to the particles in a gas?",["They move fast and spread out to fill any space","They stay still","They pack tightly","They disappear"],1],
["Detail","Where is plasma found?",["In lightning and stars","In ice cubes","In milk","In rocks"],2]]},

{id:"m2",tp:"matter",e:"⚛️",t:"Atoms: The Building Blocks",s:"Everything is made of atoms, which are mostly empty space.",
p:["Everything around you is made of atoms. They are so tiny that millions of them could fit across the width of a single hair.",
"An atom has a centre called the nucleus, which contains particles called protons and neutrons. Even smaller particles called electrons move around the nucleus.",
"Here is a surprising fact: atoms are mostly empty space. If an atom were as big as a football stadium, its nucleus would be about the size of a small marble in the centre, and the electrons would be zooming around the outer seats."],
q:[["Detail","What is the centre of an atom called?",["The nucleus","The electron","The shell","The core box"],1],
["Detail","Which particles move around the nucleus?",["Electrons","Protons","Neutrons","Molecules"],1],
["Figurative language","What does the stadium comparison show?",["Atoms are mostly empty space","Atoms are very loud","Atoms play football","Atoms are huge"],2]]},

{id:"m3",tp:"matter",e:"🧾",t:"The Table That Predicted the Future",s:"Mendeleev arranged the elements and left gaps for ones not yet discovered.",
p:["An element is a pure substance made of only one kind of atom, like oxygen, gold or iron. In the 1800s, scientists knew about 60 elements, but they did not know how to organise them.",
"In 1869, a Russian chemist named Dmitri Mendeleev arranged the elements in a table by the weight of their atoms and their properties. Elements with similar behaviour lined up in the same columns.",
"The cleverest part was that Mendeleev left gaps in his table. He said these were elements that had not been discovered yet, and he predicted their properties. Later, scientists found them, and they matched his predictions. Today the periodic table has 118 elements."],
q:[["Vocabulary","What is an element?",["A pure substance made of one kind of atom","A mixture of many things","A kind of table","A type of machine"],0],
["Detail","How did Mendeleev arrange the elements?",["By the weight of their atoms and their properties","By colour","By the alphabet","By price"],1],
["Cause & effect","Why did Mendeleev leave gaps in his table?",["For elements that had not been discovered yet","He ran out of ink","He forgot some","To make it look nice"],2]]},

{id:"m4",tp:"matter",e:"🍋",t:"Acids and Bases",s:"The pH scale tells us how acidic or basic something is.",
p:["Lemon juice tastes sour because it is an acid. Soap feels slippery because it is a base. Scientists measure how acidic or basic something is using the pH scale, which goes from 0 to 14.",
"A pH below 7 means the substance is an acid. A pH above 7 means it is a base. Pure water has a pH of exactly 7, which is called neutral.",
"You can make your own pH tester at home. Boil chopped red cabbage in water and keep the purple liquid. Add a little lemon juice and it turns pink. Add some baking soda and it turns green or blue. A substance that changes colour like this is called an indicator."],
q:[["Detail","What is the pH of pure water?",["7","0","14","100"],1],
["Detail","What does a pH below 7 mean?",["The substance is an acid","The substance is a base","The substance is neutral","The substance is a gas"],1],
["Vocabulary","What is an indicator?",["A substance that changes colour to show acids and bases","A type of acid","A kitchen tool","A kind of soap"],2]]},

{id:"m5",tp:"matter",e:"🔩",t:"Why Does Metal Rust?",s:"Iron reacts with oxygen and water to make orange-brown rust.",
p:["Have you ever seen an old bicycle covered in flaky orange-brown patches? That is rust.",
"Rust forms when iron, or steel which contains iron, reacts with oxygen and water. This chemical reaction creates a new substance called iron oxide. Rust is weak and crumbly, so it slowly eats away at the metal.",
"Rust forms faster near the sea, because salt speeds up the reaction. That is a big problem in coastal cities like those in the UAE. To stop rust, people paint metal, cover it in oil or coat it with zinc, which keeps water and oxygen away."],
q:[["Cause & effect","What does iron need to react with to rust?",["Oxygen and water","Sunlight only","Sand","Sugar"],1],
["Detail","Why does rust form faster near the sea?",["Salt speeds up the reaction","The sea is colder","There is less oxygen","Fish eat the metal"],2],
["Detail","How can people stop metal from rusting?",["Paint it, oil it or coat it with zinc","Leave it in the rain","Put it in salt water","Heat it in the sun"],2]]},

{id:"m6",tp:"matter",e:"🧊",t:"Why Ice Floats",s:"Water is strange: its solid form is lighter than its liquid form.",
p:["For most substances, the solid form is heavier than the liquid form, so it sinks. But water is different. Ice floats!",
"When water freezes, its particles arrange themselves into an open pattern with lots of space between them. This makes ice less dense than liquid water, meaning the same amount takes up more space but weighs the same. Less dense things float on denser ones.",
"This strange fact is very important for life. In winter, ice forms on top of lakes and acts like a blanket. The water underneath stays liquid, so fish and other creatures can survive until spring."],
q:[["Compare","How is water different from most substances?",["Its solid form floats on its liquid form","It cannot freeze","It has no particles","It is always a gas"],0],
["Cause & effect","Why is ice less dense than liquid water?",["Its particles form an open pattern with lots of space","It is colder","It contains air bubbles from fish","It is made of different atoms"],1],
["Cause & effect","How does floating ice help fish in winter?",["It acts like a blanket so the water below stays liquid","It gives them food","It makes the lake warmer than summer","It lets them breathe air"],2]]},

{id:"m7",tp:"matter",e:"🎆",t:"The Chemistry of Fireworks",s:"Different metals give fireworks their bright colours.",
p:["Fireworks were invented in China more than a thousand years ago. Today they light up the sky on New Year’s Eve, including above the Burj Khalifa in Dubai.",
"A firework shell contains gunpowder to launch it and burst it, plus small pellets called stars. The stars contain metal compounds. When they burn, they glow with bright colours.",
"Each metal makes its own colour. Strontium makes red, copper makes blue, sodium makes yellow and barium makes green. Chemists mix these carefully to create the patterns we see. Blue is the hardest colour to make bright."],
q:[["Detail","Where were fireworks invented?",["In China","In the UAE","In Brazil","In Egypt"],0],
["Detail","What gives fireworks their colours?",["Metal compounds in the stars","Paint on the shell","Coloured paper","Lights on the ground"],1],
["Detail","Which metal makes a blue colour?",["Copper","Sodium","Strontium","Barium"],2]]},

{id:"m8",tp:"matter",e:"🥄",t:"Where Does the Sugar Go?",s:"When sugar dissolves, it spreads between water particles to make a solution.",
p:["Stir a spoonful of sugar into a glass of water and it seems to disappear. But it is still there, as you can tell by tasting the water.",
"The sugar has dissolved. Its tiny particles have broken apart and spread out between the water particles. The mixture is called a solution. The substance that dissolves, the sugar, is called the solute, and the liquid it dissolves in, the water, is called the solvent.",
"Sugar dissolves faster in hot water than in cold water, because hot water particles move faster and bump into the sugar more often. Stirring also speeds things up. If you let the water evaporate, the sugar will be left behind as crystals."],
q:[["Vocabulary","In sugar water, what is the solvent?",["The water","The sugar","The spoon","The glass"],1],
["Cause & effect","Why does sugar dissolve faster in hot water?",["Hot water particles move faster and bump into the sugar more","Hot water is sweeter","Hot water has less water","Sugar melts like ice"],2],
["Inference","How could you get the sugar back?",["Let the water evaporate","Freeze the water","Add more water","Stir it more"],2]]},

/* ===================== PHYSICS & FORCES ===================== */
{id:"f1",tp:"physics",e:"🪶",t:"The Hammer and the Feather",s:"Without air, all objects fall at the same speed, as an astronaut showed on the Moon.",
p:["If you drop a hammer and a feather at the same time, the hammer hits the ground first. So do heavy things fall faster? Not exactly!",
"The feather falls slowly because of air resistance, the push of air against a moving object. The feather is light and wide, so the air slows it down a lot. Without air, gravity would make both objects fall at exactly the same speed.",
"In 1971, astronaut David Scott tested this on the Moon, where there is no air. On live television, he dropped a hammer and a falcon feather at the same time. They hit the ground together, just as scientists had predicted."],
q:[["Vocabulary","What is air resistance?",["The push of air against a moving object","The weight of air","Wind on a sunny day","Air inside a balloon"],1],
["Cause & effect","Why did the hammer and feather fall together on the Moon?",["There is no air on the Moon to slow the feather","The Moon has no gravity","The feather was wet","The hammer was very light"],2],
["Detail","Who did the experiment on the Moon?",["David Scott","Neil Armstrong","Isaac Newton","Galileo"],2]]},

{id:"f2",tp:"physics",e:"🛷",t:"Friction: The Force That Grips",s:"Friction slows things down, but we could not walk without it.",
p:["Friction is a force that happens when two surfaces rub against each other. It always works against movement, slowing things down.",
"Rough surfaces create more friction than smooth ones. That is why it is easy to slide on ice but hard to slide on sand or a carpet. Friction also produces heat. Rub your hands together quickly and you will feel them get warm.",
"Friction can be annoying, but we need it. Without friction, your shoes could not grip the ground, so you could not walk. Car tyres need friction to grip the road and brakes need it to stop. Engineers use oil to reduce friction inside engines, where too much rubbing would wear parts out."],
q:[["Detail","What does friction always do?",["Works against movement","Makes things go faster","Makes things float","Makes things colder"],0],
["Detail","Which surface has less friction?",["Ice","Sand","Carpet","A rough road"],1],
["Inference","What would happen without friction?",["You could not walk because your shoes could not grip","You could run faster","Nothing would change","Everything would become hot"],2]]},

{id:"f3",tp:"physics",e:"🧲",t:"The Invisible Pull of Magnets",s:"Magnets attract and repel, and Earth itself is a giant magnet.",
p:["A magnet can pull certain metals, like iron, toward it without even touching them. Every magnet has two ends, called the north pole and the south pole.",
"If you bring two magnets together, opposite poles attract, pulling toward each other, while the same poles repel, pushing each other away. Try it: a north pole and a south pole snap together, but two north poles push apart.",
"Earth itself is like a giant magnet, because of the moving liquid iron deep in its core. A compass needle is a small magnet that lines up with Earth’s magnetism, so it points north. Sailors have used compasses to find their way for about a thousand years."],
q:[["Detail","What happens when two north poles meet?",["They push each other away","They snap together","They melt","Nothing"],1],
["Vocabulary","What does ‘repel’ mean?",["Push away","Pull together","Spin around","Stick to"],1],
["Cause & effect","Why does a compass needle point north?",["It lines up with Earth’s magnetism","It is pulled by the Sun","It is heavier on one side","Sailors push it"],2]]},

{id:"f4",tp:"physics",e:"🔊",t:"How Sound Travels",s:"Sound is a vibration that needs something to travel through.",
p:["Every sound starts with a vibration. When you speak, your vocal cords vibrate. When you pluck a guitar string, it vibrates. These vibrations push on the air particles next to them, which push on the next ones, passing the sound along like a wave.",
"In air, sound travels about 343 metres per second. It moves even faster through water and faster still through solids like steel.",
"Because sound needs particles to travel through, it cannot travel in empty space. Space is silent! Astronauts on a spacewalk talk to each other using radios, which send radio waves that can travel through empty space."],
q:[["Detail","How does every sound start?",["With a vibration","With light","With heat","With electricity"],0],
["Compare","Where does sound travel fastest?",["Through solids like steel","Through air","Through empty space","Through water vapour"],1],
["Cause & effect","Why is space silent?",["There are no particles for sound to travel through","It is too cold","Astronauts are quiet","Space is too big"],2]]},

{id:"f5",tp:"physics",e:"💡",t:"The Fastest Thing in the Universe",s:"Light travels about 300,000 kilometres every second.",
p:["Nothing in the universe travels faster than light. In empty space, light travels about 300,000 kilometres every second. It could go around Earth about seven and a half times in one second.",
"Even so, space is so big that light takes time to cross it. Light from the Moon takes just over one second to reach us. Light from the Sun takes about eight minutes.",
"Because of this, when we look at stars, we see light that left them long ago. Light from some distant stars has travelled for thousands of years. So looking into space is like looking back in time."],
q:[["Detail","How far does light travel in one second?",["About 300,000 kilometres","About 300 metres","About 3 kilometres","About 3 million kilometres"],0],
["Detail","How long does light from the Moon take to reach us?",["Just over one second","Eight minutes","A year","An hour"],1],
["Inference","Why is looking into space like looking back in time?",["We see light that left stars long ago","Stars are very old people","Telescopes are clocks","Space moves backwards"],2]]},

{id:"f6",tp:"physics",e:"⚙️",t:"Simple Machines Make Work Easier",s:"Levers, pulleys and ramps help us lift and move heavy things.",
p:["A machine does not have to have an engine. Simple machines are basic tools that make work easier. There are six classic simple machines: the lever, the pulley, the wheel and axle, the inclined plane, the wedge and the screw.",
"A lever is a bar that rests on a point called a fulcrum. A see-saw is a lever. If you push down on a long lever, you can lift a heavy object with less force. The ancient Greek scientist Archimedes said: ‘Give me a place to stand, and I will move the Earth.’",
"An inclined plane is a ramp. Pushing a heavy box up a ramp takes less force than lifting it straight up. The pyramids of Egypt were probably built with the help of ramps, levers and sledges."],
q:[["Detail","How many classic simple machines are there?",["Six","Two","Ten","One"],0],
["Vocabulary","What is a fulcrum?",["The point a lever rests on","A type of ramp","A heavy box","An engine"],1],
["Detail","Why is it easier to push a box up a ramp?",["It takes less force than lifting it straight up","The box gets lighter","Ramps are slippery","The box rolls by itself"],2]]},

{id:"f7",tp:"physics",e:"🔌",t:"Electric Circuits",s:"Electricity flows only around a complete loop called a circuit.",
p:["Electricity is the flow of tiny particles called electrons. For electricity to power a lamp, it needs a complete path to flow around. This path is called a circuit.",
"A simple circuit has a battery, wires and a bulb. When everything is connected in a loop, electrons flow and the bulb lights up. A switch works by making a gap in the circuit. When the gap is open, the flow stops and the light goes out.",
"Some materials let electricity flow easily. These are called conductors, and most metals, like copper, are good conductors. Other materials, like plastic, rubber and wood, block electricity. These are insulators. That is why wires are made of copper covered in plastic."],
q:[["Vocabulary","What is a circuit?",["A complete path for electricity to flow around","A type of battery","A light bulb","A kind of plastic"],0],
["Cause & effect","How does a switch turn off a light?",["It makes a gap so the electricity stops flowing","It cools the bulb","It removes the battery","It adds more wires"],1],
["Inference","Why are wires covered in plastic?",["Plastic is an insulator that blocks electricity","Plastic makes electricity faster","Plastic is a conductor","To make them colourful only"],2]]},

{id:"f8",tp:"physics",e:"🚢",t:"Why Do Giant Ships Float?",s:"A ship floats when it pushes aside water that weighs as much as the ship.",
p:["A small steel coin sinks in water, but a huge steel ship floats. How is that possible?",
"The answer was discovered by Archimedes more than 2,000 years ago. A story says he noticed the water rise when he got into his bath. When an object is placed in water, it pushes some water out of the way. The water pushes back up with a force called buoyancy. This upward push equals the weight of the water that was pushed aside.",
"A ship is shaped like a big bowl full of air. Its wide hull pushes aside a huge amount of water, enough to equal the ship’s whole weight, so the ship floats. A coin is small and solid, so it cannot push aside enough water, and it sinks."],
q:[["Vocabulary","What is buoyancy?",["The upward push of water on an object","The weight of a ship","The speed of a boat","A type of steel"],1],
["Detail","Who discovered why things float?",["Archimedes","Newton","Einstein","Galileo"],1],
["Cause & effect","Why does a coin sink while a ship floats?",["The coin cannot push aside enough water","The coin is made of a heavier kind of steel","Ships are made of wood","Coins have holes"],2]]}
);
